<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B16">
<title>POPÔ – Caixa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#1E2B16; --lima:#9BD03B; --bg:#F4F7EF; --card:#fff; --line:#dbe3d0; --muted:#5d6a54;
  --pix:#0E9488; --din:#2E7D32; --deb:#6A3FB5; --cre:#C75B12; --wa:#1B7F3B;
  --pago:#2E9E44; --areceber:#E07B00; --red:#C62828;
  --f:'Barlow',system-ui,sans-serif; --fc:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--g);font-family:var(--f);font-size:17px}
body{padding-bottom:84px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:20px;color:var(--g)}
.wrap{max-width:560px;margin:0 auto}
/* topo */
.top{background:var(--g);color:#fff;padding:12px 16px 14px;position:sticky;top:0;z-index:5}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--fc);font-weight:800;font-size:34px;letter-spacing:1px;line-height:1;user-select:none;-webkit-user-select:none}
.logo small{display:block;font-size:11px;letter-spacing:2.5px;color:var(--lima);font-weight:700}
.data{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;color:#fff;font-weight:700;font-size:16px;text-align:right}
.data b{display:block;font-family:var(--fc);font-size:20px}
.outro-dia{background:var(--areceber);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.outro-dia button{background:#fff;color:var(--areceber);border-radius:10px;padding:8px 12px;font-weight:800}
/* faixa aluguel */
.aluguel{margin:12px 12px 0;background:var(--card);border-radius:16px;padding:12px 14px;border:2px solid var(--lima)}
.aluguel .l1{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.barra{height:14px;background:#e8eee0;border-radius:8px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--lima);border-radius:8px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px}
.num{background:var(--card);border-radius:16px;padding:12px 14px}
.num span{font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.num b{display:block;font-family:var(--fc);font-size:36px;line-height:1.05}
.grandes{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin:0 12px}
.btn-grande{border-radius:20px;padding:18px 10px;font-family:var(--fc);font-weight:800;font-size:27px;line-height:1.05;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn-grande svg{width:44px;height:44px}
.b-chegou{background:var(--lima);color:var(--g)}
.b-venda{background:var(--g);color:#fff}
.btn-grande:active{transform:translateY(2px);box-shadow:none}
.sem-foto{display:block;margin:10px auto 0;color:var(--muted);font-weight:700;text-decoration:underline;padding:8px}
h2.sec{font-family:var(--fc);font-size:24px;margin:18px 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec small{font-family:var(--f);font-size:15px;color:var(--muted)}
.vazio{margin:0 12px;padding:22px;text-align:center;color:var(--muted);background:var(--card);border-radius:16px;font-weight:600}
/* cartões */
.cartao{margin:0 12px 10px;background:var(--card);border-radius:18px;overflow:hidden;display:flex;position:relative;box-shadow:0 1px 0 var(--line)}
.cartao .foto{width:108px;min-height:108px;flex:none;background:#e6ecde center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.cartao .foto svg{width:46px;height:46px;opacity:.55}
.cartao .info{flex:1;padding:10px 12px;min-width:0}
.cartao .nome{font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartao .det{font-size:15px;color:var(--muted);margin-top:2px;line-height:1.3}
.nova-versao{display:flex;width:calc(100% - 24px);align-items:center;justify-content:space-between;gap:10px;background:var(--wa);color:#fff;border:0;border-radius:16px;padding:14px 16px;margin:12px 12px 0;font:inherit;font-size:17px;font-weight:700;text-align:left}.nova-versao b{background:#fff;color:var(--wa);border-radius:10px;padding:8px 12px;font-size:16px}
.m-pronto{background:var(--wa);color:#fff;font-size:15px !important}
.m-pronto svg{width:18px;height:18px}
.avisado{display:inline-block;font-size:13px;font-weight:800;color:var(--wa);background:#e5f3e8;border-radius:8px;padding:2px 6px;margin-top:4px}
.b-pronto{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 24px);margin:12px;background:var(--wa);color:#fff;border-radius:16px;padding:16px;font-family:var(--fc);font-size:24px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.b-pronto svg{width:28px;height:28px}
.b-pronto.feito{background:#e5f3e8;color:var(--wa);box-shadow:none;font-size:19px}
/* v1.5: PRONTO separado do WhatsApp; cliente de conta marcado na chegada */
.acoes-c{display:flex;gap:6px;margin-top:8px}
.acoes-c button{border-radius:12px;padding:10px 8px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:4px;min-height:46px}
.acoes-c .c-pronto{flex:1;background:var(--lima);color:var(--g);font-family:var(--fc);font-size:21px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.acoes-c .c-receber{flex:1;background:var(--g);color:#fff;font-family:var(--fc);font-size:21px}
.acoes-c .c-conta{flex:1;background:#1565C0;color:#fff;font-family:var(--fc);font-size:18px}
.acoes-c .m-wa{padding:10px 12px}
.acoes-c .m-wa svg{width:22px;height:22px}
.tag-conta{display:inline-block;font-size:13px;font-weight:800;color:#fff;background:#1565C0;border-radius:8px;padding:2px 7px;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duo{display:flex;gap:10px;margin:12px}
.duo button{border-radius:16px;padding:16px;font-family:var(--fc);font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.duo .d-pronto{flex:1;background:var(--lima);color:var(--g)}
.duo .d-wa{flex:none;background:var(--wa);color:#fff;font-size:18px}
.duo .d-wa svg{width:26px;height:26px}
.duo .d-feito{flex:1;background:#e5f3e8;color:var(--wa);box-shadow:none;font-size:18px;line-height:1.2;text-align:left;justify-content:flex-start}
.contas-ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.contas-ch button{background:#eaf1fb;color:#1565C0;border-radius:20px;padding:10px 14px;font-weight:800;font-size:16px;border:2px solid #cfe0f5}
.contas-ch button.on{background:#1565C0;color:#fff;border-color:#1565C0}
.contas-ch button.novo{background:#fff;border-style:dashed}
.b-lavconta{display:block;width:calc(100% - 24px);margin:10px 12px 0;background:#1565C0;color:#fff;border-radius:14px;padding:14px;font-weight:800;font-size:17px}
.cartao .lem{font-size:14px;background:#fff6d8;border-radius:8px;padding:2px 6px;margin-top:4px;display:inline-block}
.cartao .pe{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
.cartao .tot{font-family:var(--fc);font-size:22px;font-weight:800;white-space:nowrap}
.mini{display:flex;gap:6px}
.mini button{border-radius:12px;padding:8px 10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:4px}
.m-wa{background:var(--wa);color:#fff}
.m-wa svg{width:20px;height:20px}
.m-it{background:#eef3e6}
.faixa{position:absolute;top:0;left:0;right:0;color:#fff;font-weight:800;font-size:13px;padding:3px 10px;letter-spacing:.6px}
.cartao.pago{outline:3px solid var(--pago)} .cartao.pago .faixa{background:var(--pago)}
.cartao.pago .info{padding-top:24px}
/* barra de baixo */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;padding:10px 0 12px;font-weight:800;font-size:15px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--g)}
.nav button.on svg{background:var(--lima);border-radius:10px;padding:2px 10px;width:46px;box-sizing:content-box}
/* folhas (telas por cima) */
.folha{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-bottom:40px;animation:sobe .18s ease-out}
@keyframes sobe{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.f-top{background:var(--g);color:#fff;padding:12px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.f-top h1{font-family:var(--fc);font-size:26px;margin:0;flex:1}
.voltar{background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;font-size:16px}
.salva{background:var(--lima);color:var(--g);font-weight:800;padding:10px 16px;font-size:17px;display:flex;justify-content:space-between}
.bloco{background:var(--card);margin:12px;border-radius:18px;padding:14px}
.bloco h3{margin:0 0 10px;font-family:var(--fc);font-size:21px}
.servs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sv{border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:800;font-size:18px;background:#fff;min-height:58px;line-height:1.1}
.sv.on{background:var(--g);color:#fff;border-color:var(--g)}
.sv.on::before{content:"✓ ";color:var(--lima)}
.sv.outro{border-style:dashed;color:var(--muted)}
.campo{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.campo input,.campo textarea{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--lima)}
.bq{border-radius:12px;padding:12px 12px;font-weight:800;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.bq svg{width:22px;height:22px}
.bq-wa{background:var(--wa);color:#fff}
.bq-ct{background:#eef3e6}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.sug button{background:#eef3e6;border-radius:20px;padding:8px 12px;font-weight:700;font-size:15px}
.mais{width:100%;text-align:left;font-weight:800;color:var(--muted);padding:10px 2px;font-size:17px}
.tams{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tams.t3{grid-template-columns:repeat(3,1fr)}
.tm{border:2px solid var(--line);border-radius:12px;padding:8px 2px;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff}
.tm svg{width:40px;height:26px}
.tm.on{background:var(--g);color:#fff;border-color:var(--g)}
.tm.palpite{border-color:var(--areceber);border-style:dashed}
.pronto{display:block;width:calc(100% - 24px);margin:14px 12px;background:var(--lima);color:var(--g);font-family:var(--fc);font-weight:800;font-size:28px;border-radius:18px;padding:16px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.pronto.esc{background:var(--g);color:#fff}
.pronto:disabled{opacity:.4}
/* receber */
.rec-foto{width:100%;max-height:260px;object-fit:cover;display:block;background:#e6ecde}
.linha{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eef2e8;font-size:18px;gap:8px}
.linha:last-child{border-bottom:0}
.linha .x{color:var(--red);font-weight:800;padding:4px 10px;font-size:20px}
.linha input{width:120px;border:2px solid var(--areceber);border-radius:10px;padding:8px;font-size:18px}
.add{display:flex;gap:8px;margin-top:10px}
.add button{flex:1;background:#eef3e6;border-radius:12px;padding:12px;font-weight:800}
.total{text-align:center;padding:6px 0 0}
.total span{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:14px;letter-spacing:.5px}
.total b{display:block;font-family:var(--fc);font-size:58px;line-height:1}
.total s{color:var(--muted);font-size:20px}
.total em{display:block;font-style:normal;color:var(--areceber);font-weight:800}
.outro-valor{display:block;margin:8px auto 0;font-weight:800;text-decoration:underline;color:var(--muted);padding:8px}
.pags{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg{border-radius:18px;padding:18px 6px;color:#fff;font-family:var(--fc);font-weight:800;font-size:28px;box-shadow:0 3px 0 rgba(0,0,0,.2);min-height:76px}
.pg:active{transform:translateY(2px);box-shadow:none}
.pg:disabled{opacity:.35}
.pg-pix{background:var(--pix)} .pg-din{background:var(--din)} .pg-deb{background:var(--deb)} .pg-cre{background:var(--cre)}
.qr-btn{width:100%;margin-top:10px;border:2px solid var(--pix);color:var(--pix);border-radius:14px;padding:13px;font-weight:800;font-size:17px;background:#fff}
.duas{width:100%;margin-top:8px;color:var(--muted);font-weight:800;text-decoration:underline;padding:8px}
.aviso{background:#fff4e0;border-radius:12px;padding:10px 12px;font-weight:700;margin-bottom:10px;color:#7a4300}
.pe-rec{display:flex;gap:10px;margin:0 12px}
.pe-rec button{flex:1;border-radius:14px;padding:14px;font-weight:800;font-size:16px}
.b-entregue{background:var(--pago);color:#fff}
.b-apagar{background:#fff;color:var(--red);border:2px solid #f0c9c9 !important}
/* grade de itens */
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-height:112px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.it svg{width:34px;height:34px}
.it .nm{font-weight:800;font-size:14px;line-height:1.1;text-align:center}
.it .pr{font-family:var(--fc);font-weight:800;font-size:19px;background:#eef3e6;border-radius:10px;padding:1px 8px}
.it .qt{position:absolute;top:-8px;right:-6px;background:var(--lima);color:var(--g);border-radius:20px;min-width:30px;height:30px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.it.on{border-color:var(--lima)}
.dica{color:var(--muted);font-size:14px;text-align:center;margin:8px 0 0}
/* preços */
.tab-pr{width:100%;border-collapse:collapse;font-size:17px}
.tab-pr th{font-size:13px;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px}
.tab-pr th:first-child{text-align:left}
.tab-pr td{padding:6px 4px;border-top:1px solid #eef2e8}
.tab-pr td.v{text-align:right}
.tab-pr td.v button{white-space:nowrap;font-weight:800;font-size:17px;background:#eef3e6;border-radius:10px;padding:8px 8px;min-width:70px;text-align:right}
.tab-pr td.v button.vz{color:var(--muted);font-weight:600}
.mudou{display:block;font-size:12px;color:var(--muted)}
/* resumo */
.abas{display:flex;gap:8px;margin:12px}
.abas button{flex:1;min-width:0;border-radius:14px;padding:12px 4px;font-family:var(--fc);font-weight:800;font-size:19px;background:#fff;border:2px solid var(--line)}
.filtro{margin:0 12px 6px;background:var(--card);border-radius:16px;padding:12px}
.filtro .datas{display:flex;gap:8px;align-items:center}
.filtro .datas label{flex:1;font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase}
.filtro .datas input{display:block;width:100%;margin-top:3px;border:2px solid var(--line);border-radius:10px;padding:9px 6px;font-size:16px;font-family:inherit}
.filtro .atalhos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.filtro .atalhos button{background:#eef3e6;border-radius:20px;padding:8px 12px;font-weight:800;font-size:14px}
.filtro .atalhos button.on{background:var(--g);color:#fff}
.linha b{white-space:nowrap}
.dias.muitos{gap:3px}.dias.muitos div{font-size:11px}.dias.muitos b{font-size:12px}
.abas button.on{background:var(--g);color:#fff;border-color:var(--g)}
.per{display:flex;align-items:center;justify-content:space-between;margin:0 12px}
.per button{background:#fff;border-radius:12px;width:54px;height:48px;font-size:26px;font-weight:800;border:2px solid var(--line)}
.per button:disabled{opacity:.3}
.per b{font-size:18px;text-align:center}
.grande-num{text-align:center;margin:12px}
.grande-num span{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:14px}
.grande-num b{display:block;font-family:var(--fc);font-size:56px;line-height:1}
.forma{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:18px;font-weight:700}
.forma i{width:14px;height:14px;border-radius:4px;flex:none}
.forma span{flex:1}
.forma .bb{flex:1.4;height:12px;background:#eef2e8;border-radius:6px;overflow:hidden}
.forma .bb u{display:block;height:100%}
.duas-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px}
.duas-col .num{margin:0}
.duas-col .num b{font-size:30px}
.lan{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2e8;width:100%;text-align:left;font-size:16px}
.lan .h{color:var(--muted);font-weight:700;width:46px;flex:none}
.lan .d{flex:1;min-width:0}
.lan .d small{display:block;color:var(--muted)}
.lan .v{font-weight:800;text-align:right}
.chip{display:inline-block;border-radius:8px;color:#fff;font-size:12px;font-weight:800;padding:1px 6px;margin-left:3px}
.dias{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:6px}
.dias div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:13px;font-weight:700;color:var(--muted)}
.dias u{display:block;width:100%;background:#cfdcc0;border-radius:6px 6px 0 0;min-height:3px}
.dias div.mel u{background:var(--lima)}
.dias div.mel{color:var(--g)}
.dias b{font-size:15px;color:var(--g)}
.fechar{display:block;width:calc(100% - 24px);margin:12px;background:var(--g);color:#fff;border-radius:16px;padding:16px;font-family:var(--fc);font-size:24px;font-weight:800}
.fechado{text-align:center;color:var(--pago);font-weight:800;margin:10px}
/* overlays */
.modal{position:fixed;inset:0;background:rgba(20,30,15,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .cx{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:sobe .18s}
.modal h3{font-family:var(--fc);font-size:26px;margin:0 0 6px}
.modal p{margin:0 0 12px;font-size:17px}
.botoes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.botoes button{border-radius:14px;padding:15px;font-weight:800;font-size:18px;background:#eef3e6}
.botoes .pri{background:var(--g);color:#fff}
.botoes .lim{background:var(--lima);color:var(--g)}
.botoes .per{background:#fff;color:var(--red);border:2px solid #f0c9c9}
.ok{position:fixed;inset:0;z-index:60;background:var(--pago);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}

// ---------- Pix (BR Code) ----------
function semAcento(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim(); }
function campo(id, v){ return id + pad(v.length) + v; }
function crc16(s){
  let c = 0xFFFF;
  for (let i=0;i<s.length;i++){ c ^= s.charCodeAt(i) << 8; for (let j=0;j<8;j++) c = (c & 0x8000) ? ((c<<1) ^ 0x1021) & 0xFFFF : (c<<1) & 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4,'0');
}
function chavePix(){
  const k = String(D.cfg.pixChave||'').trim();
  if (/^[\d.\-\/ ]+$/.test(k) && so_dig(k).length === 14) return so_dig(k);   // CNPJ
  if (/^[\d.\-\/ ]+$/.test(k) && so_dig(k).length === 11 && !/^\(?\d{2}\)?\s?9/.test(k)) return so_dig(k); // CPF
  return k;
}
function payloadPix(valor){
  const nome = (semAcento(D.cfg.pixNome) || 'POPO').slice(0,25);
  const cid = (semAcento(D.cfg.pixCidade) || 'BRASIL').slice(0,15);
  let p = campo('00','01') + campo('26', campo('00','br.gov.bcb.pix') + campo('01', chavePix()))
        + campo('52','0000') + campo('53','986');
  if (valor > 0) p += campo('54', valor.toFixed(2));
  p += campo('58','BR') + campo('59', nome) + campo('60', cid) + campo('62', campo('05','***')) + '6304';
  return p + crc16(p);
}
function desenharQR(canvas, texto){
  const q = new QRLib.QRCode(-1, QRLib.L.M); q.addData(texto); q.make();
  const n = q.getModuleCount(), m = 4, esc_ = 8, tam = (n + m*2) * esc_;
  canvas.width = tam; canvas.height = tam;
  const g = canvas.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,tam,tam); g.fillStyle = '#000';
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) g.fillRect((c+m)*esc_, (r+m)*esc_, esc_, esc_);
}

// ---------- foto ----------
function reduzirFoto(arquivo){
  return new Promise((ok) => {
    const url = URL.createObjectURL(arquivo), img = new Image();
    img.onload = () => {
      const max = 720, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ok(null); };
    img.src = url;
  });
}

// ---------- INÍCIO ----------
function cicloAluguel(dia){
  const d = dt(dia), dv = D.cfg.aluguelDia || 10;
  let venc = new Date(d.getFullYear(), d.getMonth(), dv, 12);
  if (d.getDate() > dv) venc = new Date(d.getFullYear(), d.getMonth()+1, dv, 12);
  const ini = new Date(venc); ini.setMonth(ini.getMonth()-1); ini.setDate(ini.getDate()+1);
  return {ini: ymd(ini), fim: ymd(venc)};
}
function entrouEntre(a, b){ return r2(D.lanc.filter(l => l.data >= a && l.data <= b).reduce((x,l)=>x+l.valor,0)); }
function avisoCopia(){
  if (!D.lanc.length) return '';
  const primeiro = D.lanc.reduce((m,l) => l.data < m ? l.data : m, D.lanc[0].data);
  const base = D.cfg.ultBackup || primeiro;
  const dias = Math.round((dt(hoje()) - dt(base)) / 86400000);
  if (dias < 30) return '';
  return '<div class="bloco aviso" style="margin:12px;display:flex;align-items:center;gap:10px"><span style="flex:1">'+(D.cfg.ultBackup?'Faz '+dias+' dias da última cópia de segurança.':'Ainda não foi feita nenhuma cópia de segurança.')+'</span><button class="bq" style="background:var(--g);color:#fff" onclick="A.backup()">Salvar agora</button></div>';
}
function telaInicio(){
  const dia = U.dia;
  const lh = D.lanc.filter(l => l.data === dia);
  // carros que CHEGARAM no dia: os que ainda estão na lista + os já pagos/na conta que chegaram nesse dia
  const carros = D.abertos.filter(a => a.tipo === 'carro' && a.data === dia && a.status !== 'pago').length + D.lanc.filter(l => l.tipo === 'carro' && (l.chegada || l.data) === dia).length;
  const entrou = r2(lh.reduce((x,l)=>x+l.valor,0));
  const ciclo = cicloAluguel(hoje()), alu = D.cfg.aluguel || 0, ja = entrouEntre(ciclo.ini, ciclo.fim);
  const pct = alu ? Math.min(100, Math.round(ja/alu*100)) : 0;
  let h = '<div class="wrap">' + avisoAcesso(estadoAcesso());
  if (U.novaVersao) h += '<button class="nova-versao" onclick="A.atualizarApp()"><span>Saiu uma versão nova do app</span><b>ATUALIZAR</b></button>';
  if (alu) h += '<div class="aluguel"><div class="l1"><span>Aluguel '+fmt0(alu)+' · vence '+ddmm(ciclo.fim)+'</span><span>'+(ja>=alu?'✓ coberto':pct+'%')+'</span></div>'+
      '<div class="barra"><i style="width:'+pct+'%"></i></div><div class="pequeno" style="margin-top:6px">Entrou desde '+ddmm(ciclo.ini)+': <b>'+fmt(ja)+'</b>'+(ja<alu?' · faltam '+fmt(alu-ja):'')+'</div></div>';
  h += '<div class="nums"><div class="num"><span>Carros '+(dia===hoje()?'hoje':ddmm(dia))+' <small style="text-transform:none">(chegaram)</small></span><b>'+carros+'</b></div><div class="num"><span>Entrou '+(dia===hoje()?'hoje':ddmm(dia))+'</span><b style="font-size:30px;white-space:nowrap">'+fmt(entrou)+'</b></div></div>';

  if (jaDeve) h += '<div class="aviso-dev">Atenção: '+esc(jaDeve.nome)+' já deve '+fmt(saldoConta(jaDeve))+' desde '+ddmm(devendoDesde(jaDeve))+'.</div>';

    if (!a.tam && caro) h += '<div class="aviso">Tamanho não foi marcado. O preço muda bastante: confira antes de receber.</div>';

      '<button class="x" onclick="A.tirarItem(\''+a.id+'\','+i+')">−</button></span></div>';

  h += '<div class="add">'+(a.tipo==='carro'?'<button onclick="A.addServ(\''+a.id+'\')">+ Serviço</button>':'')+'<button onclick="A.itensPara(\''+a.id+'\')">+ Itens</button></div></div>';
  const tot = totalNormal(a);

  if (tot.falta) h += '<b style="font-size:30px">Falta o valor</b><em>Digite o valor do serviço acima</em>';
  else if (R.outro != null && R.outro !== tot.t) h += '<b>'+fmt(R.outro)+'</b><s>'+fmt(tot.t)+'</s><em>'+(R.outro<tot.t?'desconto de '+fmt(tot.t-R.outro):'acréscimo de '+fmt(R.outro-tot.t))+'</em>';

  const pode = !tot.falta && cobrar > 0;

  const cc = contaDo(a);
  // v1.6: cliente de conta reconhecido pelo telefone: o botão dele vem primeiro

    '<div class="pequeno" style="text-align:center;margin:2px 0 8px">Se ele pagou agora, toque na forma:</div>';

  if (!R.duas) h += '<button class="qr-btn" '+(pode?'':'disabled')+' onclick="A.mostrarQR(\''+a.id+'\')">Mostrar QR do Pix (cliente aqui)</button>';

  else h += '<button class="duas" onclick="A.duasFormas(\''+a.id+'\')">Pagou em 2 formas</button>';

  if (!R.duas) {
    const nSem = semanais().length;
    h += '<div class="bloco"><div class="sub-pg">Não pagou agora</div><div class="nao-pagou">'+
      '<button class="b-ncont" '+(pode && nSem ? '' : 'disabled')+' onclick="A.escolherConta(\''+a.id+'\')">CLIENTE DE CONTA<small>'+(nSem ? 'paga no sábado' : 'nenhum cadastrado')+'</small></button>'+
      '<button class="b-depois" '+(pode?'':'disabled')+' onclick="A.pagarDepois(\''+a.id+'\')">VAI PAGAR DEPOIS<small>fica no fiado</small></button></div>'+
      (!nSem ? '<button class="na-conta-link" onclick="abrirFolha({t:\'clientes\'})">Cadastrar cliente de conta</button>' : '')+'</div>';
  }
  h += '<div class="pe-rec"><button class="b-apagar" onclick="A.apagar(\''+a.id+'\')">Apagar</button></div>';
  return h;
}

function itensOrdenados(){ return D.itens.slice(); }   // ordem fixa
function folhaItens(f){
  const c = f.carrinho;
  const alvo = f.alvo ? D.abertos.find(x => x.id === f.alvo) : null;
  let h = '<div class="f-top"><button class="voltar" onclick="fecharFolha()">‹</button><h1>'+(alvo?'+ Itens · '+esc(alvo.nome||(alvo.tipo==='conta'?'Conta':'Carro')):'Venda')+'</h1></div>';
  h += '<div class="bloco"><div class="grade">';
  itensOrdenados().forEach(it => {
    const q = c[it.id] ? c[it.id].qtd : 0, pr = c[it.id] && c[it.id].preco != null ? c[it.id].preco : it.venda;
    h += '<div class="it '+(q?'on':'')+'" data-item="'+it.id+'">'+(q?'<span class="qt">'+q+'</span>':'')+(IC[it.ic]||IC.copo)+'<span class="nm">'+esc(it.nome)+'</span><span class="pr" data-preco="'+it.id+'">'+fmt0(pr)+'</span></div>';
  });
  h += '<div class="it" data-item="__outro">'+IC.mais+'<span class="nm">Outro</span><span class="pr">valor</span></div>';
  (f.outros||[]).forEach((o,i) => h += '<div class="it on" data-outro="'+i+'"><span class="qt">'+o.qtd+'</span>'+IC.copo+'<span class="nm">'+esc(o.nome)+'</span><span class="pr">'+fmt0(o.preco)+'</span></div>');
  h += '</div><p class="dica">'+(alvo?'':'Conte o que foi consumido: ')+'toque soma 1 · segure o dedo para tirar 1 · toque no preço para trocar</p></div>';
  const tot = totalCarrinho(f);
  h += '<div class="bloco"><div class="total"><span>'+(alvo?'Somar à conta':'Total')+'</span><b>'+fmt(tot)+'</b></div></div>';
  if (alvo) h += '<button class="pronto" '+(tot?'':'disabled')+' onclick="A.confirmarItens()">ADICIONAR</button>';
  else h += '<button class="pronto" '+(tot?'':'disabled')+' onclick="A.pagarAgora()">RECEBER</button>';
  return h;
}
function totalCarrinho(f){
  let t = 0;
  for (const id in f.carrinho) { const it = itemPorId(id), c = f.carrinho[id]; if (it) t += (c.preco!=null?c.preco:it.venda) * c.qtd; }
  (f.outros||[]).forEach(o => t += o.preco*o.qtd);
  return r2(t);
}
function linhasCarrinho(f){
  const out = [];
  for (const id in f.carrinho) { const it = itemPorId(id), c = f.carrinho[id]; if (it && c.qtd) out.push({id, nome:it.nome, preco:c.preco!=null?c.preco:it.venda, custo:it.custo, qtd:c.qtd}); }
  (f.outros||[]).forEach(o => out.push({id:'outro', nome:o.nome, preco:o.preco, custo:null, qtd:o.qtd}));
  return out;
}
function somarItens(a, linhas){
  a.itens = a.itens || [];
  linhas.forEach(l => {
    const ex = a.itens.find(i => i.id === l.id && i.preco === l.preco && i.nome === l.nome);
    if (ex) ex.qtd += l.qtd; else a.itens.push({...l});
  });
}

// ---------- RESUMO ----------
function inicioSemana(dia){ const d = dt(dia); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); }
function calcular(a, b){
  const L = D.lanc.filter(l => l.data >= a && l.data <= b);
  const r = {total:0, formas:{pix:0,din:0,deb:0,cre:0}, carros:0, bebidas:0, lav:0, beb:0, contas:0, nContas:0, recContas:0, tam:{}, serv:{}, item:{}, L};
  L.forEach(l => {
    r.total += l.valor;
    if (l.conta) { r.contas += l.conta.valor; r.nContas++; }
    if (l.tipo === 'conta') r.recContas += l.valor;
    l.pag.forEach(p => r.formas[p.forma] += p.valor);
    if (l.tipo === 'carro') { r.carros++; if (l.tam) r.tam[l.tam] = (r.tam[l.tam]||0)+1; }
    let vs = 0, vi = 0;
    (l.servs||[]).forEach(s => { vs += s.preco||0; r.serv[s.nome] = (r.serv[s.nome]||0)+1; });
    (l.itens||[]).forEach(i => { vi += i.preco*i.qtd; r.bebidas += i.qtd; r.item[i.nome] = (r.item[i.nome]||0)+i.qtd; });
    const n = vs+vi, k = n ? l.valor/n : 0;
    if (l.tipo === 'conta') r.lav += l.valor;
    else if (n) { r.lav += vs*k; r.beb += vi*k; } else r.lav += l.valor;
  });
  ['total','lav','beb','contas','recContas'].forEach(k => r[k] = r2(r[k])); for (const k in r.formas) r.formas[k] = r2(r.formas[k]);
  // v1.6: quem saiu sem pagar (conta semanal ou devedor) e como está hoje
  const np = {n:0, carros:0, v:0, conta:{n:0,v:0}, dev:{n:0,v:0}, pagos:{n:0,v:0}, devem:{n:0,v:0}, L:[]};
  L.filter(l => l.conta).forEach(l => {
    const st = situacaoLanc(l), v = l.conta.valor, tp = l.conta.tipo === 'avulso' ? 'dev' : 'conta';
    np.n++; if (l.tipo === 'carro') np.carros++; np.v += v; np[tp].n++; np[tp].v += v;
    if (st.pagoEm) { np.pagos.n++; np.pagos.v += v; } else { np.devem.n++; np.devem.v += st.resta; np.pagos.v += r2(v - st.resta); }
    np.L.push({l, st, tp});
  });
  ['v'].forEach(k => np[k] = r2(np[k])); ['conta','dev','pagos','devem'].forEach(k => np[k].v = r2(np[k].v));
  r.np = np;
  // v1.6.1: cada pagamento de conta/devedor sabe a que lavagens se refere (as mais antigas primeiro)
  const LP = L.filter(l => l.contaPag), cacheQ = {};
  let recV = 0, recAntes = 0;
  const recL = LP.map(l => {
    const c = contaPorId(l.contaPag); let aloc = [];
    if (c) { const m = c.movs.find(x => x.lanc === l.id); if (m) { cacheQ[c.id] = cacheQ[c.id] || quitacao(c); aloc = (cacheQ[c.id][m.id] || {aloc:[]}).aloc; } }
    const antes = r2(aloc.filter(x => x.data < a).reduce((x,y) => x + y.valor, 0));
    recV += l.valor; recAntes += antes;
    return {l, aloc, antes};
  });
  r.recAnt = {v:r2(recV), antes:r2(recAntes), L:recL};
  // serviços feitos no período (pagos na hora + saíram sem pagar), sem contar pagamento de dívida
  r.servicos = r2(L.filter(l => !l.contaPag).reduce((x,l) => x + l.valor + (l.conta ? l.conta.valor : 0), 0));
  return r;
}
function blocoFormas(r){
  const max = Math.max(1, ...Object.values(r.formas));
  return '<div class="bloco">'+Object.keys(FORMAS).map(k => '<div class="forma"><i style="background:'+FORMAS[k].c+'"></i><span>'+FORMAS[k].n+'</span><div class="bb"><u style="width:'+Math.round(r.formas[k]/max*100)+'%;background:'+FORMAS[k].c+'"></u></div><b style="min-width:110px;text-align:right">'+fmt(r.formas[k])+'</b></div>').join('')+'</div>';
}
// =====================================================================
//  v1.7 RELATÓRIOS SIMPLES: três palavras só
//    ENTROU    = dinheiro que caiu (gaveta + banco)
//    TRABALHOU = valor de todos os serviços feitos (pagos ou não)
//    FIADO     = o que saiu sem pagar (cliente de conta ou levou sem pagar)
// =====================================================================
const LIM_LISTA = 10;
const dSem = d => DIAS_SEM[dt(d).getDay()].toLowerCase()+' '+ddmm(d);
// "lavagem de seg 23/11" / "lavagens de 16/11 e 23/11" / "lavagens de 4 dias (desde 02/11)"
function deQuando(aloc){
  const ds = [...new Set(aloc.map(x => x.data))].sort();
  if (!ds.length) return '';
  if (ds.length === 1) return 'lavagem de ' + dSem(ds[0]);
  if (ds.length === 2) return 'lavagens de ' + ddmm(ds[0]) + ' e ' + ddmm(ds[1]);
  return 'lavagens de ' + ds.length + ' dias (desde ' + ddmm(ds[0]) + ')';
}
// topo: ENTROU (com gaveta e banco), TRABALHOU e FIADO
function topoRelatorio(r, quando, comparar){
  const banco = r2(r.formas.pix + r.formas.deb + r.formas.cre);
  let h = '<div class="rel-entrou"><span>ENTROU '+quando+'</span><b>'+fmt(r.total)+'</b>'+
    '<div class="gb"><div><small>Na gaveta (dinheiro)</small><strong>'+fmt(r.formas.din)+'</strong></div><div><small>No banco (Pix e cartão)</small><strong>'+fmt(banco)+'</strong></div></div>'+
    (r.recAnt.v ? '<p class="nota">Desse total, <b>'+fmt(r.recAnt.v)+'</b> foi pagamento de fiado.</p>' : '')+(comparar||'')+'</div>';
  h += '<div class="duas-col"><div class="num"><span>Trabalhou</span><b>'+fmt(r.servicos)+'</b><small class="sub">'+r.carros+' carro'+(r.carros===1?'':'s')+' atendido'+(r.carros===1?'':'s')+'</small></div>'+
    '<div class="num'+(r.np.v?' fiado':'')+'"><span>Ficou no fiado</span><b>'+fmt(r.np.v)+'</b><small class="sub">'+r.np.carros+' carro'+(r.np.carros===1?'':'s')+(r.np.conta.n?' · '+r.np.conta.n+' na conta':'')+'</small></div></div>';
  return h;
}
// lista de quem ficou no fiado no período (por pessoa no período longo, um por um no dia)
function blocoFiado(r, titulo, porPessoa){
  if (!r.np.n) return '<div class="bloco"><h3 style="margin:0">'+titulo+': ninguém</h3><span class="pequeno">Todo mundo pagou na hora.</span></div>';
  let itens;
  if (!porPessoa) itens = r.np.L.slice().sort((a,b) => a.l.ts - b.l.ts).map(({l, st, tp}) => ({nome:l.cliente||'Sem nome', det:esc((l.servs||[]).map(x=>x.nome).join(' + ')||'Venda'), valor:l.conta.valor, tp, pago:!!st.pagoEm, quando:st.pagoEm, resta:st.resta}));
  else {
    const por = {};
    r.np.L.forEach(({l, st, tp}) => { const k = l.conta.id; const p = por[k] = por[k] || {nome:l.cliente||'Sem nome', n:0, valor:0, resta:0, tp}; p.n++; p.valor = r2(p.valor + l.conta.valor); p.resta = r2(p.resta + (st.pagoEm ? 0 : st.resta)); });
    itens = Object.values(por).sort((a,b) => b.resta - a.resta || b.valor - a.valor).map(p => ({nome:p.nome, det:p.n+' serviço'+(p.n>1?'s':''), valor:p.valor, tp:p.tp, pago:p.resta <= 0.001, resta:p.resta}));
  }
  const linha = x => '<div class="np"><span class="d"><b>'+esc(x.nome)+(x.tp==='conta'?' <span class="chip-st tp-conta">conta</span>':'')+'</b><small>'+x.det+'</small>'+
    (x.pago ? '<span class="chip-st st-ok">já pagou'+(x.quando?' '+ddmm(x.quando):'')+'</span>' : x.resta < x.valor ? '<span class="chip-st st-parte">pagou parte · deve '+fmt(x.resta)+'</span>' : '<span class="chip-st st-deve">ainda deve</span>')+
    '</span><span class="v">'+fmt(x.valor)+'</span></div>';
  const voltou = r2(r.np.v - r.np.devem.v);
  return '<div class="bloco fiado-b"><h3>'+titulo+'</h3>'+itens.slice(0, LIM_LISTA).map(linha).join('')+
    (itens.length > LIM_LISTA ? '<div class="linha"><span class="pequeno">+ '+(itens.length-LIM_LISTA)+' pessoas</span><b>'+fmt(r2(itens.slice(LIM_LISTA).reduce((a,x)=>a+x.valor,0)))+'</b></div>' : '')+
    (voltou > 0.001 ? '<p class="pequeno" style="margin:8px 0 0">Desse fiado, <b style="color:var(--pago)">'+fmt(voltou)+' já voltou</b> · <b style="color:var(--red)">'+fmt(r.np.devem.v)+' ainda falta</b></p>' : '')+'</div>';
}
// carros que ainda estão na lista sem pagar (só no relatório do dia)
function blocoPatio(d){
  const patio = D.abertos.filter(a => a.tipo === 'carro' && a.data === d && a.status === 'aberto' && !a.temp);
  if (!patio.length) return '';
  return '<div class="bloco"><h3>Ainda na lista, sem pagar</h3>'+patio.map(a => { const t = totalNormal(a); return '<div class="linha"><span>'+esc(a.nome||'Sem nome')+'<br><span class="pequeno">'+esc(resumoServ(a)||'—')+'</span></span><b>'+(t.falta?'?':fmt(t.t))+'</b></div>'; }).join('')+
    '<p class="pequeno" style="margin:6px 0 0">Resolva no FECHAR DIA: pagou, conta ou levou sem pagar.</p></div>';
}
// quem pagou fiado no período, e de que dia era a lavagem
function blocoRecebiFiado(r, titulo){
  if (!r.recAnt.L.length) return '';
  const L = r.recAnt.L.slice().sort((a,b) => a.l.ts - b.l.ts);
  return '<div class="bloco"><h3 style="display:flex;justify-content:space-between">'+titulo+' <span style="white-space:nowrap;color:var(--pago)">'+fmt(r.recAnt.v)+'</span></h3>'+
    L.slice(0, LIM_LISTA).map(({l, aloc}) => '<div class="np"><span class="d"><b>'+esc(String(l.cliente||'').replace(/^(Conta|Pagamento) – /,''))+'</b><small>'+esc(deQuando(aloc))+' · pagou '+dSem(l.data)+' no '+(FORMAS[l.pag[0].forma]?FORMAS[l.pag[0].forma].n:'')+'</small></span><span class="v" style="color:var(--pago)">'+fmt(l.valor)+'</span></div>').join('')+
    (L.length > LIM_LISTA ? '<div class="linha"><span class="pequeno">+ '+(L.length-LIM_LISTA)+' pagamentos</span><b>'+fmt(r2(L.slice(LIM_LISTA).reduce((a,x)=>a+x.l.valor,0)))+'</b></div>' : '')+'</div>';
}
// fiado de antes do período que continua aberto (acumula até pagar)
function blocoFiadoAntigo(ini, quando){
  const velhas = D.contas.map(c => ({c, v:dividaAntes(c, ini)})).filter(x => x.v > 0.001).sort((a,b) => devendoDesde(a.c) < devendoDesde(b.c) ? -1 : 1);
  if (!velhas.length) return '';
  const tot = r2(velhas.reduce((x,o)=>x+o.v,0));
  return '<div class="bloco" style="border:2px solid var(--red)"><h3 style="display:flex;justify-content:space-between">Fiado antigo ainda aberto <span style="color:var(--red);white-space:nowrap">'+fmt(tot)+'</span></h3>'+
    '<p class="pequeno" style="margin:-4px 0 6px">Serviços de antes '+quando+' que ainda não foram pagos. O fiado não some: acumula até pagar.</p>'+
    velhas.slice(0, LIM_LISTA).map(({c, v}) => '<div class="linha"><span>'+esc(c.nome)+(c.tipo==='semanal'?' <span class="chip-st tp-conta">conta</span>':'')+'<br><span class="pequeno">desde '+dSem(devendoDesde(c))+'</span></span><b style="color:var(--red)">'+fmt(v)+'</b></div>').join('')+
    (velhas.length > LIM_LISTA ? '<div class="linha"><span class="pequeno">+ '+(velhas.length-LIM_LISTA)+' pessoas</span><b>'+fmt(r2(velhas.slice(LIM_LISTA).reduce((a,x)=>a+x.v,0)))+'</b></div>' : '')+'</div>';
}
// v1.6.1: lavagens ainda não pagas (as mais antigas são quitadas primeiro)
function lavsAbertas(c){ const q = quitacao(c); return c.movs.filter(m => m.tipo === 'lav' && q[m.id] && q[m.id].resta > 0.001).sort((a,b) => a.ts - b.ts); }
function devendoDesde(c){ const l = lavsAbertas(c); return l.length ? l[0].data : hoje(); }
// quanto um cliente ainda deve de lavagens feitas ANTES de um dia
function dividaAntes(c, dia){
  const q = quitacao(c);
  return r2(c.movs.filter(m => m.tipo === 'lav' && m.data < dia).reduce((x,m) => x + (q[m.id] ? q[m.id].resta : 0), 0));
}
function maisFreq(o){ let k=null,n=0; for (const x in o) if (o[x]>n){n=o[x];k=x;} return k ? k+' ('+n+')' : '—'; }
const MESES_LONGO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const inicioMes = d => d.slice(0,8) + '01';
function fimMes(d){ const x = dt(inicioMes(d)); x.setMonth(x.getMonth()+1); x.setDate(0); return ymd(x); }
function addMeses(d, n){ const x = dt(inicioMes(d)); x.setMonth(x.getMonth()+n); return ymd(x); }
function botaoMais(){ return '<button class="ver-mais" onclick="A.verMais()">'+(U.verMais?'▴ Esconder detalhes':'▾ Ver mais detalhes')+'</button>'; }
function telaResumo(){
  if (estadoAcesso().nivel === 'parcial') return '<div class="wrap">' + telaTravada() + '</div>';
  const ab = (id, n) => '<button class="'+(U.resumo===id?'on':'')+'" onclick="A.aba(\''+id+'\')">'+n+'</button>';
  let h = '<div class="wrap"><div class="abas">'+ab('dia','Dia')+ab('semana','Semana')+ab('mes','Mês')+ab('periodo','Período')+'</div>';
  if (U.resumo === 'dia') {
    const d = U.resDia, r = calcular(d, d), dd = dt(d), eHoje = d === hoje();
    h += '<div class="per"><button onclick="A.resDia(-1)">‹</button><b>'+(eHoje?'Hoje, ':DIAS_SEM[dd.getDay()]+', ')+dd.getDate()+' '+MESES[dd.getMonth()]+'</b><button '+(d>=hoje()?'disabled':'')+' onclick="A.resDia(1)">›</button></div>';
    h += topoRelatorio(r, eHoje ? 'HOJE' : 'NO DIA');
    h += blocoFiado(r, eHoje ? 'Ficou no fiado hoje' : 'Ficou no fiado neste dia', false);

      h += '<div class="bloco"><h3>Formas de pagamento</h3>'+blocoFormas(r).replace(/^<div class="bloco">/,'').replace(/<\/div>$/,'')+'</div>';

      h += '<h2 class="sec">Lançamentos <small>toque para corrigir</small></h2><div class="bloco" style="margin-top:0">';
      if (!r.L.length) h += '<div class="pequeno">Nada lançado neste dia.</div>';
      r.L.slice().sort((a,b)=>b.ts-a.ts).forEach(l => {
        h += '<button class="lan" onclick="A.editarLanc(\''+l.id+'\')"><span class="h">'+hora(l.ts)+'</span><span class="d">'+esc(l.cliente || (l.tipo==='carro'?'Carro':'Venda'))+'<small>'+esc([(l.servs||[]).map(s=>s.nome).join(' + '), (l.itens||[]).map(i=>i.qtd+'× '+i.nome).join(', ')].filter(Boolean).join(' · '))+'</small></span>'+
          '<span class="v">'+(l.conta?fmt(l.conta.valor):fmt(l.valor))+'<br>'+(l.conta?(l.conta.tipo==='avulso'?'<span class="chip" style="background:var(--areceber)">Fiado</span>':'<span class="chip" style="background:#1565C0">Conta</span>'):'')+l.pag.map(p=>'<span class="chip" style="background:'+FORMAS[p.forma].c+'">'+FORMAS[p.forma].n+'</span>').join('')+'</span></button>';
      });
      h += '</div>';
    }
    if (D.dias[d] && D.dias[d].fechado) h += '<div class="fechado">✓ Dia fechado às '+hora(D.dias[d].fechado)+'</div>';
    h += '<button class="fechar" onclick="A.fecharDia()">'+(D.dias[d]&&D.dias[d].fechado?'Fechar dia de novo':'FECHAR DIA')+'</button>';
  } else if (U.resumo === 'semana') {
    const ini = U.resSem || inicioSemana(hoje()), fim = addDias(ini, 6), sab = addDias(ini, 5), atual = ini === inicioSemana(hoje());
    h += '<div class="per"><button onclick="A.resSem(-1)">‹</button><b>Seg '+ddmm(ini)+' a sáb '+ddmm(sab)+(atual?'<br><span class="pequeno">esta semana</span>':'')+'</b><button '+(atual?'disabled':'')+' onclick="A.resSem(1)">›</button></div>';
    h += relatorioPeriodo(ini, fim, {quando:'NA SEMANA', antes:'desta semana', nesta:'nesta semana', antIni:addDias(ini,-7), antFim:addDias(ini,-1), antNome:'a semana passada', grafico:'dias'});
  } else if (U.resumo === 'mes') {
    const ini = U.resMes || inicioMes(hoje()), fim = fimMes(ini), atual = ini === inicioMes(hoje()), m = dt(ini);
    h += '<div class="per"><button onclick="A.resMes(-1)">‹</button><b>'+MESES_LONGO[m.getMonth()]+' '+m.getFullYear()+(atual?'<br><span class="pequeno">este mês, até hoje</span>':'')+'</b><button '+(atual?'disabled':'')+' onclick="A.resMes(1)">›</button></div>';
    h += relatorioPeriodo(ini, fim, {quando:'NO MÊS', antes:'deste mês', nesta:'neste mês', antIni:addMeses(ini,-1), antFim:fimMes(addMeses(ini,-1)), antNome:'o mês passado', grafico:'semanas'});
  } else {
    const ini = U.perIni || addDias(hoje(), -29), fim = U.perFim || hoje(), nd = diasEntre(ini, fim) + 1;
    const at = (id, n) => '<button class="'+(U.perAtalho===id?'on':'')+'" onclick="A.perAtalho(\''+id+'\')">'+n+'</button>';
    h += '<div class="filtro"><div class="datas"><label>De<input type="date" id="pIni" value="'+ini+'" max="'+hoje()+'" onchange="A.perDatas()"></label><label>Até<input type="date" id="pFim" value="'+fim+'" max="'+hoje()+'" onchange="A.perDatas()"></label></div>'+
      '<div class="atalhos">'+at('7','Últimos 7 dias')+at('15','Últimos 15 dias')+at('30','Últimos 30 dias')+at('mes','Este mês')+at('mesant','Mês passado')+at('90','3 meses')+at('ano','Este ano')+'</div></div>';
    h += '<p style="text-align:center;margin:4px 12px 0;font-weight:800">'+ddmm(ini)+'/'+ini.slice(0,4)+' a '+ddmm(fim)+'/'+fim.slice(0,4)+' <span class="pequeno">('+nd+' dia'+(nd>1?'s':'')+')</span></p>';
    h += relatorioPeriodo(ini, fim, {quando:'NO PERÍODO', antes:'deste período', nesta:'no período', antIni:addDias(ini,-nd), antFim:addDias(ini,-1), antNome:'os '+nd+' dias anteriores', grafico: nd <= 15 ? 'dias' : nd <= 120 ? 'semanas' : 'meses'});
  }
  return h + '</div>';
}
// semana, mês e período: mesmo relatório
function relatorioPeriodo(ini, fim, o){
  const r = calcular(ini, fim), ant = calcular(o.antIni, o.antFim);
  let comp = '';
  if (ant.L.length) { const dif = r2(r.total-ant.total); comp = '<p class="nota" style="color:'+(dif>=0?'var(--pago)':'var(--red)')+'">'+(dif>=0?'▲ ':'▼ ')+fmt(Math.abs(dif))+(dif>=0?' a mais':' a menos')+' que '+o.antNome+'</p>'; }
  let h = topoRelatorio(r, o.quando, comp);
  h += blocoFiado(r, 'Quem ficou no fiado '+o.nesta, true);
  h += blocoFiadoAntigo(ini, o.antes);
  h += blocoRecebiFiado(r, 'Recebi de fiado '+o.nesta);
  h += botaoMais();
  if (U.verMais) {
    h += '<div class="bloco"><h3>Formas de pagamento</h3>'+blocoFormas(r).replace(/^<div class="bloco">/,'').replace(/<\/div>$/,'')+'</div>';
    const diasTrab = new Set(r.L.filter(l => !l.contaPag).map(l => l.data)).size;
    h += '<div class="bloco"><div class="linha"><span>Dias trabalhados</span><b>'+diasTrab+'</b></div>'+(diasTrab?'<div class="linha"><span>Média por dia</span><b>'+fmt(r2(r.servicos/diasTrab))+'</b></div><div class="linha"><span>Carros por dia</span><b>'+(Math.round(r.carros/diasTrab*10)/10).toString().replace('.',',')+'</b></div>':'')+
      '<div class="linha"><span>Do que entrou: lavagens</span><b>'+fmt(r.lav)+'</b></div><div class="linha"><span>Do que entrou: bebidas e itens</span><b>'+fmt(r.beb)+'</b></div><div class="linha"><span>Bebidas e itens vendidos</span><b>'+r.bebidas+' un.</b></div>'+
      '<div class="linha"><span>Serviço que mais saiu</span><b>'+esc(maisFreq(r.serv))+'</b></div><div class="linha"><span>Item que mais vendeu</span><b>'+esc(maisFreq(r.item))+'</b></div></div>';
    h += graficoCarros(ini, fim, o.grafico, r);
    h += '<div class="bloco"><h3>Carros por tamanho</h3>'+(Object.keys(r.tam).length? Object.keys(TAM_NOME).filter(k=>r.tam[k]).map(k => '<div class="linha"><span>'+TAM_NOME[k]+'</span><b>'+r.tam[k]+'</b></div>').join('') : '<span class="pequeno">Sem tamanho marcado ainda.</span>')+'</div>';
  }
  return h;
}
// carros por dia (semana / período curto), por semana (mês) ou por mês (período longo)
function graficoCarros(ini, fim, modo, r){
  const carros = D.lanc.filter(l => l.tipo === 'carro' && l.data >= ini && l.data <= fim);
  let gr = [];
  if (modo === 'dias') {
    for (let d = ini; d <= fim; d = addDias(d, 1)) { const Ld = carros.filter(l => l.data === d); gr.push({d, n:Ld.length, sp:Ld.filter(l => l.conta).length, rot: diasEntre(ini, fim) <= 6 ? DIAS_SEM[dt(d).getDay()] : String(dt(d).getDate()), domingo: dt(d).getDay() === 0}); }
    gr = gr.filter(x => !x.domingo || x.n);
  } else if (modo === 'semanas') {
    for (let s0 = inicioSemana(ini); s0 <= fim; s0 = addDias(s0, 7)) { const a = s0 < ini ? ini : s0, b = addDias(s0, 6) > fim ? fim : addDias(s0, 6); const Ld = carros.filter(l => l.data >= a && l.data <= b); gr.push({n:Ld.length, sp:Ld.filter(l => l.conta).length, rot: ddmm(a), nome:'semana de '+ddmm(a)}); }
  } else {
    for (let m0 = inicioMes(ini); m0 <= fim; m0 = addMeses(m0, 1)) { const Ld = carros.filter(l => l.data.slice(0,7) === m0.slice(0,7)); gr.push({n:Ld.length, sp:Ld.filter(l => l.conta).length, rot: MESES[dt(m0).getMonth()], nome:MESES_LONGO[dt(m0).getMonth()]}); }
  }
  const mx = Math.max(0, ...gr.map(x => x.n));
  const tit = modo === 'dias' ? 'Carros por dia' : modo === 'semanas' ? 'Carros por semana' : 'Carros por mês';
  const melhor = mx ? gr.filter(x => x.n === mx).map(x => x.nome || (modo==='dias' && diasEntre(ini,fim) <= 6 ? x.rot : ddmm(x.d))).join(', ') : '';
  return '<div class="bloco"><h3>'+tit+' · total '+r.carros+'</h3><div class="dias'+(gr.length > 8 ? ' muitos' : '')+'">'+gr.map(x => '<div class="'+(mx&&x.n===mx?'mel':'')+'"><b>'+x.n+'</b><span class="snp">'+(x.sp?x.sp:'')+'</span><u style="height:'+(mx?Math.round(x.n/mx*100):0)+'%"></u>'+x.rot+'</div>').join('')+'</div>'+
    (gr.some(x=>x.sp)?'<p class="pequeno" style="margin:6px 0 0"><b style="color:var(--areceber)">Número laranja</b> = carros que ficaram no fiado</p>':'')+(mx?'<p class="pequeno" style="margin:8px 0 0">Melhor '+(modo==='dias'?'dia':modo==='semanas'?'semana':'mês')+': <b>'+esc(melhor)+'</b></p>':'')+'</div>';
}

const A = {
  ir(t){ U.tela = t; if (t==='resumo') { U.resDia = U.dia; } window.scrollTo(0,0); render(); },
  trocarDia(){
    modal('<h3>Lançar em outro dia</h3><p>Para lançar algo que ficou esquecido.</p><div class="campo"><input id="dIn" type="date" max="'+hoje()+'" value="'+U.dia+'"></div>'+
      '<div class="botoes"><button class="pri" onclick="A.okDia()">Usar este dia</button><button onclick="fecharModal();A.voltarHoje()">Hoje</button></div>');
  },
  okDia(){ const v = $('#dIn').value; fecharModal(); if (v && v <= hoje()) { U.dia = v; render(); } },
  voltarHoje(){ U.dia = hoje(); render(); },

  // --- carro chega ---
  // o carro é salvo ANTES de a câmera abrir: se o celular fechar o app durante a foto, o carro não se perde
  chegouCarro(){
    const ts = U.dia === hoje() ? Date.now() : dt(U.dia).getTime();
    const a = {id:uid(), tipo:'carro', criado:ts, data:U.dia, foto:null, aguardaFoto:true, tel:'', nome:'', tam:null, moto:false, servs:[], itens:[], lembrete:'', status:'aberto'};
    D.abertos.push(a); salvar(); vibra(40);
    A.abrirCamera(a.id);
  },
  abrirCamera(aid){ U.fotoAlvo = aid; const c = $('#cam'); c.value = ''; c.click(); },
  async fotoEscolhida(arq){
    if (!arq) return;
    const foto = await reduzirFoto(arq);
    let a = U.fotoAlvo ? D.abertos.find(x => x.id === U.fotoAlvo) : null;
    U.fotoAlvo = null;
    if (!a) { A.criarCarro(foto, false); return; }

// ---------- fechar pagamento ----------
function voltarHojeSeOutroDia(){
  if (U.dia !== hoje()) { const d = U.dia; U.dia = hoje(); setTimeout(() => toast('Lançado em '+ddmm(d)+'. Voltei para hoje.', 3500), 50); }
}
function fecharPagamento(a, pag, valor, normal){
  const diaLanc = U.dia;
  const ts = U.dia === hoje() ? Date.now() : dt(U.dia).getTime() + (Date.now() % 3600000);
  const tam = a.tipo === 'carro' ? tamUsado(a) : null;
  const l = {id:uid(), ts, data:U.dia, tipo:a.tipo === 'carro' ? 'carro' : 'venda', chegada:a.data, cliente:a.nome || '', tel:a.tel || '', tam,
    servs: linhasServ(a).map(s => ({id:s.id, nome:s.nome, preco:s.preco})), itens:(a.itens||[]).map(i => ({...i})),
    normal, valor:r2(valor), pag:pag.map(p => ({forma:p.forma, valor:r2(p.valor)})), desconto:r2(normal - valor)};
  D.lanc.push(l);
  if (a.tipo === 'carro') { a.tam = tam; guardarCliente(a); }
  const idx = D.abertos.findIndex(x => x.id === a.id), guard = JSON.parse(JSON.stringify(a));
  D.abertos.splice(idx, 1);
  salvar(); vibra([60,40,60]);

// ---------- controle de acesso (código com validade + lista de bloqueio no site) ----------
const SUPORTE = 'quem instalou o app';
const TOLERANCIA = 3;   // dias depois de vencer, antes de travar
if (!D.cfg.aparelho) { D.cfg.aparelho = ACESSO.novoId(); salvar(); }
function comSuporte(m){ m = String(m||'').trim(); return /fale com/i.test(m) ? m : (m ? m + ' ' : '') + 'Fale com ' + SUPORTE + '.'; }
function diasEntre(a, b){ return Math.round((dt(b) - dt(a)) / 86400000); }
function estadoAcesso(){
  const hj = hoje();
  if (!D.cfg.maiorData || hj > D.cfg.maiorData) { D.cfg.maiorData = hj; salvar(); }
  const ref = D.cfg.maiorData > hj ? D.cfg.maiorData : hj;          // se a data do celular voltar, vale a maior já vista
  const ate = D.cfg.codigo ? ACESSO.conferir(D.cfg.aparelho, D.cfg.codigo) : null;
  const rem = D.cfg.remoto && D.cfg.remoto.status;
  const msgRem = (D.cfg.remoto && D.cfg.remoto.msg) || '';
  if (!ate) return {nivel:'total', motivo:'ativar'};
  if (rem === 'total') return {nivel:'total', motivo:'remoto', msg:msgRem, ate};
  const resta = diasEntre(ref, ate);
  if (resta < -TOLERANCIA) return {nivel:'parcial', motivo:'vencido', ate};
  if (rem === 'parcial') return {nivel:'parcial', motivo:'remoto', msg:msgRem, ate};
  if (resta < 0) return {nivel:'ok', aviso:'tolerancia', resta: TOLERANCIA + resta + 1, ate};
  if (resta <= 7) return {nivel:'ok', aviso:'vence', resta, ate};
  return {nivel:'ok', ate};
}
const dmA = s_ => s_.slice(8,10)+'/'+s_.slice(5,7)+'/'+s_.slice(0,4);

  if (ac.aviso === 'tolerancia') return '<div class="av-acesso vermelho">Seu acesso venceu em '+dmA(ac.ate)+'. Em '+ac.resta+' dia'+(ac.resta>1?'s':'')+' o Resumo e as cobranças serão travados. Fale com '+SUPORTE+'.</div>';

// ---------- clientes de conta (fecham no sábado; o que não for pago acumula) ----------
const contaPorId = id => D.contas.find(c => c.id === id);
const semanais = () => D.contas.filter(c => c.tipo === 'semanal' && c.ativo !== false);
const devedores = () => D.contas.filter(c => c.tipo === 'avulso' && saldoConta(c) > 0.001);
const tel8 = t => so_dig(t).slice(-8);
// v1.6: só reconhece cliente de conta CADASTRADO, e só pelo telefone (nome igual não basta)
function contaDo(a){
  if (!a) return null;
  if (a.contaId === 'nao') return null;
  if (a.contaId) { const c = contaPorId(a.contaId); if (c && c.tipo === 'semanal' && c.ativo !== false) return c; }
  const t = tel8(a.tel);
  if (t.length >= 8) return semanais().find(c => tel8(c.tel) === t) || null;
  return null;
}
// devedor avulso com débito em aberto pelo telefone (para avisar quando ele volta)
function devedorDo(a){
  const t = tel8(a && a.tel); if (t.length < 8) return null;
  return devedores().find(c => tel8(c.tel) === t) || null;
}
// acha (pelo telefone) ou cria o devedor avulso
function devedorPara(nome, tel){
  const t = tel8(tel);
  let c = t.length >= 8 ? D.contas.find(x => x.tipo === 'avulso' && tel8(x.tel) === t) : null;
  if (!c) { c = {id:uid(), tipo:'avulso', ativo:true, nome:nome || 'Sem nome', tel:tel || '', movs:[], cobrancas:[], criado:Date.now()}; D.contas.push(c); }
  else { if (nome) c.nome = nome; if (tel) c.tel = tel; }
  return c;
}
// quanto de cada lavagem já foi pago (os pagamentos quitam as lavagens mais antigas primeiro)
function quitacao(c){
  const res = {}, fila = [];
  c.movs.slice().sort((a,b) => a.ts - b.ts || (a.tipo === 'lav' ? -1 : 1)).forEach(m => {
    if (m.tipo === 'lav') { const r = {valor:m.valor, resta:m.valor, pagoEm:null, data:m.data, desc:m.desc}; res[m.id] = r; fila.push(r); return; }
    let v = m.valor; const p = res[m.id] = {aloc:[]};
    while (v > 0.001 && fila.length) {
      const r = fila[0], t = Math.min(v, r.resta);
      r.resta = r2(r.resta - t); v = r2(v - t); r.ultPag = m.data;
      p.aloc.push({data:r.data, desc:r.desc, valor:r2(t)});
      if (r.resta <= 0.001) { r.resta = 0; r.pagoEm = m.data; fila.shift(); }
    }
  });
  return res;
}
// situação hoje de um lançamento que saiu sem pagar
function situacaoLanc(l){
  const c = contaPorId(l.conta.id); if (!c) return {txt:'sem registro', cls:'st-parte', resta:0};
  const m = c.movs.find(x => x.lanc === l.id); if (!m) return {txt:'sem registro', cls:'st-parte', resta:0};
  const q = quitacao(c)[m.id];
  if (q.pagoEm) return {txt:'Pago em '+ddmm(q.pagoEm), cls:'st-ok', resta:0, pagoEm:q.pagoEm};
  if (q.resta < q.valor) return {txt:'Pagou parte · falta '+fmt(q.resta), cls:'st-parte', resta:q.resta};
  return {txt:'Ainda deve', cls:'st-deve', resta:q.resta};
}
function saldoConta(c, ate){
  return r2(c.movs.filter(m => !ate || m.data <= ate).reduce((x,m) => x + (m.tipo==='lav' ? m.valor : -m.valor), 0));

  let h = '<div class="f-top"><button class="voltar" onclick="fecharFolha()">‹</button><h1>'+esc(c.nome)+'</h1><button class="voltar" onclick="A.editarConta(\''+c.id+'\')">Editar</button>'+(c.tel?'<button class="bq bq-wa" onclick="abrirWa(\''+esc(c.tel)+'\')">'+IC.wa+'</button>':'')+'</div>';
  if (c.tipo === 'avulso') h += '<div class="aviso-dev">Fiado · levou sem pagar'+(c.tel?'':' · sem telefone: toque em Editar para colocar')+'</div>';
  else if (c.carro) h += '<p class="pequeno" style="margin:8px 16px 0">Cliente de conta · '+esc(c.carro)+'</p>';
  h += '<div class="bloco"><div class="total"><span>Deve hoje</span><b style="color:'+(sd>0?'var(--g)':'var(--pago)')+'">'+fmt(sd)+'</b>'+
    ((c.cobrancas||[]).length ? '<em style="color:var(--muted)">Última cobrança enviada em '+ddmm(c.cobrancas[c.cobrancas.length-1])+'</em>' : '')+'</div></div>';
  h += '<div class="pe-rec" style="margin-bottom:4px"><button class="b-cobrar" '+(c.tel&&sd>0?'':'disabled style="opacity:.4"')+' onclick="A.cobrar(\''+c.id+'\')">Enviar cobrança no WhatsApp</button></div>';
  h += '<div class="pe-rec" style="margin-top:10px"><button class="b-recebi" '+(sd>0?'':'disabled style="opacity:.4"')+' onclick="A.recebiConta(\''+c.id+'\')">RECEBI</button></div>';
  if (c.tipo === 'semanal') h += '<button class="b-lavconta" onclick="A.lavagemConta(\''+c.id+'\')">+ Lançar lavagem nesta conta</button>';
  if (!c.tel && c.tipo === 'semanal') h += '<p class="pequeno" style="margin:8px 16px">Sem telefone: toque em Editar para colocar e poder mandar a cobrança.</p>';
  h += '<h2 class="sec">Extrato</h2><div class="bloco" style="margin-top:0">';
  const abertos = new Set(lavsAbertas(c).map(m => m.id));
  const qx = quitacao(c);
  const ordemG = m => m.tipo === 'pag' ? 2 : abertos.has(m.id) ? 0 : 1;
  const movs = c.movs.slice().sort((a,b)=> ordemG(a)-ordemG(b) || b.ts-a.ts).slice(0,60);
  if (!movs.length) h += '<span class="pequeno">Nada lançado ainda.</span>';
  let grupo = null;
  movs.forEach(m => {
    const g = m.tipo === 'pag' ? 'Pagamentos' : abertos.has(m.id) ? 'Falta pagar' : 'Já pago';
    if (g !== grupo) { h += '<div class="pequeno" style="font-weight:800;margin-top:8px;color:'+(g==='Falta pagar'?'var(--red)':'var(--muted)')+'">'+g+'</div>'; grupo = g; }
    const qm = m.tipo === 'lav' ? qx[m.id] : null, parte = qm && qm.resta > 0.001 && qm.resta < m.valor - 0.001;
    h += '<div class="mov '+(m.tipo==='pag'?'pag':'')+'"><span>'+ddmm(m.data)+' · '+esc(m.tipo==='lav'?m.desc:'Pagamento ('+(FORMAS[m.forma]?FORMAS[m.forma].n:'')+')')+(parte?'<br><small style="color:var(--red);font-weight:800">pagou '+fmt(r2(m.valor-qm.resta))+' · falta '+fmt(qm.resta)+'</small>':'')+'</span><b>'+(m.tipo==='pag'?'− ':'')+fmt(m.valor)+'</b></div>';
  });
  h += '</div>';
  return h;
}

// ---------- pergunta da manhã: carros de dias anteriores ----------
function perguntaManha(){
  const h = hoje();
  if (D.perguntaFeita === h) return;
  // carros pagos que ficaram de ontem saem sozinhos
  const antes = D.abertos.length;
  D.abertos = D.abertos.filter(a => !(a.status === 'pago' && (a.pagoEm || a.data) < h));
  if (D.abertos.length !== antes) salvar();
  const fila = D.abertos.filter(a => a.tipo === 'carro' && a.status === 'aberto' && a.data < h);
  if (!fila.length) { D.perguntaFeita = h; salvar(); return; }
  perguntarCarro(fila, 0);
}
// v1.6: usado na manhã seguinte (carros de dias anteriores) e no FECHAR DIA (carros de hoje)
function perguntarCarro(fila, i, fim){
  if (i >= fila.length) { if (!fim) D.perguntaFeita = hoje(); salvar(); fecharModal(); render(); if (fim) fim(); return; }
  const a = fila[i], tot = totalNormal(a), cc = contaDo(a);
  const prox = () => { salvar(); perguntarCarro(fila, i+1, fim); };
  window._pc = (r) => {
    if (r === 'aqui') { prox(); return; }
    if (r === 'conta') { lancarNaConta(a, cc, tot.t, tot.t, true, a.data); prox(); return; }
    if (r === 'escolher') { A.escolherConta(null, c => { if (c) { lancarNaConta(a, c, tot.t, tot.t, true, a.data); prox(); } else perguntarCarro(fila, i, fim); }); return; }
    if (r === 'nao') { A.dadosDevedor(a, tot.t, tot.t, c => { if (c) { lancarNaConta(a, c, tot.t, tot.t, true, a.data); prox(); } else perguntarCarro(fila, i, fim); }); return; }
    const l = {id:uid(), ts:a.data === hoje() ? Date.now() : dt(a.data).getTime()+6*3600000, data:a.data, chegada:a.data, tipo:'carro', cliente:a.nome||'', tel:a.tel||'', tam:tamUsado(a),
      servs:linhasServ(a).map(s=>({id:s.id,nome:s.nome,preco:s.preco})), itens:(a.itens||[]).map(x=>({...x})), normal:tot.t, valor:tot.t, pag:[{forma:r, valor:tot.t}], desconto:0};
    D.lanc.push(l); a.tam = l.tam; guardarCliente(a); D.abertos = D.abertos.filter(x => x.id !== a.id);
    prox();
  };
  const semValor = tot.falta || !tot.t;
  modal('<h3>'+(fim?'Fechando o dia':'Carro de '+ddmm(a.data))+' ('+(i+1)+' de '+fila.length+')</h3>'+(a.foto?'<img class="pergunta-foto" src="'+a.foto+'">':'')+
    '<p><b>'+esc(a.nome||'Sem nome')+'</b> · '+esc(resumoServ(a)||'sem serviço')+(semValor?'':' · '+fmt(tot.t))+'</p>'+
    (semValor?'<div class="aviso">Esse carro está sem valor. Toque em "Ainda está aqui" e abra o cartão para conferir.</div>':'')+
    '<div class="sub-pg">Pagou</div><div class="pags">'+Object.keys(FORMAS).map(k => '<button class="pg pg-'+k+'" style="font-size:22px;min-height:60px" '+(semValor?'disabled':'')+' onclick="_pc(\''+k+'\')">'+FORMAS[k].n+'</button>').join('')+'</div>'+
    '<div class="sub-pg" style="margin-top:12px">Não pagou</div><div class="nao-pagou">'+
      (cc ? '<button class="b-ncont" '+(semValor?'disabled':'')+' onclick="_pc(\'conta\')">NA CONTA<small>'+esc(cc.nome)+'</small></button>'
          : '<button class="b-ncont" '+(semValor||!semanais().length?'disabled':'')+' onclick="_pc(\'escolher\')">CLIENTE DE CONTA<small>paga no sábado</small></button>')+
      '<button class="b-depois" '+(semValor?'disabled':'')+' onclick="_pc(\'nao\')">LEVOU SEM PAGAR<small>fica no fiado</small></button></div>'+
    '<div class="botoes"><button class="pri" onclick="_pc(\'aqui\')">Ainda está aqui</button></div>');
}

// ---------- eventos gerais ----------
$('#cam').addEventListener('change', e => A.fotoEscolhida(e.target.files[0]));
$('#cam').addEventListener('cancel', () => A.fotoCancelada());
$('#arqBackup').addEventListener('change', e => A.recuperar(e.target.files[0]));
function ligarLogo(){
  const l = $('#logo'); if (!l) return;
  let t;
  const ini = () => { t = setTimeout(() => { vibra(80); abrirFolha({t:'ajustes'}); }, 1500); };
  const fim = () => clearTimeout(t);
  l.addEventListener('pointerdown', ini); l.addEventListener('pointerup', fim); l.addEventListener('pointerleave', fim); l.addEventListener('pointercancel', fim);
  l.addEventListener('contextmenu', e => e.preventDefault());
}
// toque e segurar na grade de itens
(function(){
  let tm = null, segurou = false, alvo = null, x0 = 0, y0 = 0;
  document.addEventListener('pointerdown', e => {
    const pr = e.target.closest('[data-preco]');
    const it = e.target.closest('[data-item],[data-outro]');
    if (!it || pr) return;
    alvo = it; segurou = false; x0 = e.clientX; y0 = e.clientY;
    tm = setTimeout(() => { segurou = true; if (alvo.dataset.item && alvo.dataset.item !== '__outro') A.segurarItem(alvo.dataset.item); else if (alvo.dataset.outro) A.segurarOutro(+alvo.dataset.outro); }, 500);
  });
  document.addEventListener('pointermove', e => { if (alvo && (Math.abs(e.clientX-x0)>12 || Math.abs(e.clientY-y0)>12)) { clearTimeout(tm); alvo = null; } });
  document.addEventListener('pointerup', e => {
    clearTimeout(tm);
    const pr = e.target.closest('[data-preco]');
    if (pr && !alvo) { A.trocarPrecoItem(pr.dataset.preco); return; }
    if (alvo && !segurou) { if (alvo.dataset.item) A.toqueItem(alvo.dataset.item); else A.toqueOutro(+alvo.dataset.outro); }
    alvo = null;
  });
  document.addEventListener('pointercancel', () => { clearTimeout(tm); alvo = null; });
  document.addEventListener('contextmenu', e => { if (e.target.closest('[data-item],[data-outro]')) e.preventDefault(); });
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checarRemoto(); if (U.dia < hoje() && !U.folhas.length) U.dia = hoje(); render(); perguntaManha(); } });
window.addEventListener('popstate', () => { if ($('#modal')) { fecharModal(); history.pushState(null,''); } else if (U.folhas.length) { fecharFolha(); history.pushState(null,''); } });
history.pushState(null,'');
// atualiza "há x min" dos cartões
setInterval(() => { if (U.tela === 'inicio' && !U.folhas.length && !$('#modal') && !$('#ok')) render(); }, 60000);

try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
migrar();
render();
checarRemoto();
setInterval(checarRemoto, 30*60000);
(function(){
  if (estadoAcesso().nivel === 'total') return;
  const p = D.abertos.find(a => a.aguardaFoto && !a.foto && Date.now() - a.criado < 15*60000);
  if (p) { abrirFolha({t:'novo', id:p.id}); return; }
  perguntaManha();
})();
// atalho do ícone (segurar o ícone > Chegou carro): o navegador só abre a câmera depois de um toque
if (new URLSearchParams(location.search).has('v')) { history.replaceState(null, '', location.pathname); setTimeout(() => toast('App atualizado · versão ' + VERSAO_APP), 600); }
if (new URLSearchParams(location.search).get('acao') === 'carro') {
  history.replaceState(null, '', location.pathname);
  modal('<h3>Chegou carro</h3><div class="botoes"><button class="lim" style="font-size:26px;padding:26px" onclick="fecharModal();A.chegouCarro()">TIRAR FOTO</button><button onclick="fecharModal()">Voltar</button></div>');
}
</script>
