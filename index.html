<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B16">
<title>POPÔ – Caixa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#1E2B16; --lima:#9BD03B; --bg:#F4F7EF; --card:#fff; --line:#dbe3d0; --muted:#5d6a54;
  --pix:#0E9488; --din:#2E7D32; --deb:#6A3FB5; --cre:#C75B12; --wa:#1B7F3B;
  --pago:#2E9E44; --areceber:#E07B00; --red:#C62828;
  --f:'Barlow',system-ui,sans-serif; --fc:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--g);font-family:var(--f);font-size:17px}
body{padding-bottom:84px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:20px;color:var(--g)}
.wrap{max-width:560px;margin:0 auto}
/* topo */
.top{background:var(--g);color:#fff;padding:12px 16px 14px;position:sticky;top:0;z-index:5}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--fc);font-weight:800;font-size:34px;letter-spacing:1px;line-height:1;user-select:none;-webkit-user-select:none}
.logo small{display:block;font-size:11px;letter-spacing:2.5px;color:var(--lima);font-weight:700}
.data{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;color:#fff;font-weight:700;font-size:16px;text-align:right}
.data b{display:block;font-family:var(--fc);font-size:20px}
.outro-dia{background:var(--areceber);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.outro-dia button{background:#fff;color:var(--areceber);border-radius:10px;padding:8px 12px;font-weight:800}
/* faixa aluguel */
.aluguel{margin:12px 12px 0;background:var(--card);border-radius:16px;padding:12px 14px;border:2px solid var(--lima)}
.aluguel .l1{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.barra{height:14px;background:#e8eee0;border-radius:8px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--lima);border-radius:8px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px}
.num{background:var(--card);border-radius:16px;padding:12px 14px}
.num span{font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.num b{display:block;font-family:var(--fc);font-size:36px;line-height:1.05}
.grandes{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin:0 12px}
.btn-grande{border-radius:20px;padding:18px 10px;font-family:var(--fc);font-weight:800;font-size:27px;line-height:1.05;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn-grande svg{width:44px;height:44px}
.b-chegou{background:var(--lima);color:var(--g)}
.b-venda{background:var(--g);color:#fff}
.btn-grande:active{transform:translateY(2px);box-shadow:none}
.sem-foto{display:block;margin:10px auto 0;color:var(--muted);font-weight:700;text-decoration:underline;padding:8px}
h2.sec{font-family:var(--fc);font-size:24px;margin:18px 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec small{font-family:var(--f);font-size:15px;color:var(--muted)}
.vazio{margin:0 12px;padding:22px;text-align:center;color:var(--muted);background:var(--card);border-radius:16px;font-weight:600}
/* cartões */
.cartao{margin:0 12px 10px;background:var(--card);border-radius:18px;overflow:hidden;display:flex;position:relative;box-shadow:0 1px 0 var(--line)}
.cartao .foto{width:108px;min-height:108px;flex:none;background:#e6ecde center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.cartao .foto svg{width:46px;height:46px;opacity:.55}
.cartao .info{flex:1;padding:10px 12px;min-width:0}
.cartao .nome{font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartao .det{font-size:15px;color:var(--muted);margin-top:2px;line-height:1.3}
.cartao .lem{font-size:14px;background:#fff6d8;border-radius:8px;padding:2px 6px;margin-top:4px;display:inline-block}
.cartao .pe{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
.cartao .tot{font-family:var(--fc);font-size:22px;font-weight:800;white-space:nowrap}
.mini{display:flex;gap:6px}
.mini button{border-radius:12px;padding:8px 10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:4px}
.m-wa{background:var(--wa);color:#fff}
.m-wa svg{width:20px;height:20px}
.m-it{background:#eef3e6}
.faixa{position:absolute;top:0;left:0;right:0;color:#fff;font-weight:800;font-size:13px;padding:3px 10px;letter-spacing:.6px}
.cartao.pago{outline:3px solid var(--pago)} .cartao.pago .faixa{background:var(--pago)}
.cartao.areceber{outline:3px solid var(--areceber)} .cartao.areceber .faixa{background:var(--areceber)}
.cartao.pago .info,.cartao.areceber .info{padding-top:24px}
/* barra de baixo */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;padding:10px 0 12px;font-weight:800;font-size:15px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--g)}
.nav button.on svg{background:var(--lima);border-radius:10px;padding:2px 10px;width:46px;box-sizing:content-box}
/* folhas (telas por cima) */
.folha{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-bottom:40px;animation:sobe .18s ease-out}
@keyframes sobe{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.f-top{background:var(--g);color:#fff;padding:12px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.f-top h1{font-family:var(--fc);font-size:26px;margin:0;flex:1}
.voltar{background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;font-size:16px}
.salva{background:var(--lima);color:var(--g);font-weight:800;padding:10px 16px;font-size:17px;display:flex;justify-content:space-between}
.bloco{background:var(--card);margin:12px;border-radius:18px;padding:14px}
.bloco h3{margin:0 0 10px;font-family:var(--fc);font-size:21px}
.servs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sv{border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:800;font-size:18px;background:#fff;min-height:58px;line-height:1.1}
.sv.on{background:var(--g);color:#fff;border-color:var(--g)}
.sv.on::before{content:"✓ ";color:var(--lima)}
.sv.outro{border-style:dashed;color:var(--muted)}
.campo{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.campo input,.campo textarea{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--lima)}
.bq{border-radius:12px;padding:12px 12px;font-weight:800;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.bq svg{width:22px;height:22px}
.bq-wa{background:var(--wa);color:#fff}
.bq-ct{background:#eef3e6}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.sug button{background:#eef3e6;border-radius:20px;padding:8px 12px;font-weight:700;font-size:15px}
.mais{width:100%;text-align:left;font-weight:800;color:var(--muted);padding:10px 2px;font-size:17px}
.tams{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tams.t3{grid-template-columns:repeat(3,1fr)}
.tm{border:2px solid var(--line);border-radius:12px;padding:8px 2px;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff}
.tm svg{width:40px;height:26px}
.tm.on{background:var(--g);color:#fff;border-color:var(--g)}
.tm.palpite{border-color:var(--areceber);border-style:dashed}
.pronto{display:block;width:calc(100% - 24px);margin:14px 12px;background:var(--lima);color:var(--g);font-family:var(--fc);font-weight:800;font-size:28px;border-radius:18px;padding:16px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.pronto.esc{background:var(--g);color:#fff}
.pronto:disabled{opacity:.4}
/* receber */
.rec-foto{width:100%;max-height:260px;object-fit:cover;display:block;background:#e6ecde}
.linha{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eef2e8;font-size:18px;gap:8px}
.linha:last-child{border-bottom:0}
.linha .x{color:var(--red);font-weight:800;padding:4px 10px;font-size:20px}
.linha input{width:120px;border:2px solid var(--areceber);border-radius:10px;padding:8px;font-size:18px}
.add{display:flex;gap:8px;margin-top:10px}
.add button{flex:1;background:#eef3e6;border-radius:12px;padding:12px;font-weight:800}
.total{text-align:center;padding:6px 0 0}
.total span{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:14px;letter-spacing:.5px}
.total b{display:block;font-family:var(--fc);font-size:58px;line-height:1}
.total s{color:var(--muted);font-size:20px}
.total em{display:block;font-style:normal;color:var(--areceber);font-weight:800}
.outro-valor{display:block;margin:8px auto 0;font-weight:800;text-decoration:underline;color:var(--muted);padding:8px}
.pags{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg{border-radius:18px;padding:18px 6px;color:#fff;font-family:var(--fc);font-weight:800;font-size:28px;box-shadow:0 3px 0 rgba(0,0,0,.2);min-height:76px}
.pg:active{transform:translateY(2px);box-shadow:none}
.pg:disabled{opacity:.35}
.pg-pix{background:var(--pix)} .pg-din{background:var(--din)} .pg-deb{background:var(--deb)} .pg-cre{background:var(--cre)}
.qr-btn{width:100%;margin-top:10px;border:2px solid var(--pix);color:var(--pix);border-radius:14px;padding:13px;font-weight:800;font-size:17px;background:#fff}
.duas{width:100%;margin-top:8px;color:var(--muted);font-weight:800;text-decoration:underline;padding:8px}
.aviso{background:#fff4e0;border-radius:12px;padding:10px 12px;font-weight:700;margin-bottom:10px;color:#7a4300}
.pe-rec{display:flex;gap:10px;margin:0 12px}
.pe-rec button{flex:1;border-radius:14px;padding:14px;font-weight:800;font-size:16px}
.b-entregue{background:var(--pago);color:#fff}
.b-apagar{background:#fff;color:var(--red);border:2px solid #f0c9c9 !important}
/* grade de itens */
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-height:112px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.it svg{width:34px;height:34px}
.it .nm{font-weight:800;font-size:14px;line-height:1.1;text-align:center}
.it .pr{font-family:var(--fc);font-weight:800;font-size:19px;background:#eef3e6;border-radius:10px;padding:1px 8px}
.it .qt{position:absolute;top:-8px;right:-6px;background:var(--lima);color:var(--g);border-radius:20px;min-width:30px;height:30px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.it.on{border-color:var(--lima)}
.dica{color:var(--muted);font-size:14px;text-align:center;margin:8px 0 0}
/* preços */
.tab-pr{width:100%;border-collapse:collapse;font-size:17px}
.tab-pr th{font-size:13px;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px}
.tab-pr th:first-child{text-align:left}
.tab-pr td{padding:6px 4px;border-top:1px solid #eef2e8}
.tab-pr td.v{text-align:right}
.tab-pr td.v button{white-space:nowrap;font-weight:800;font-size:17px;background:#eef3e6;border-radius:10px;padding:8px 8px;min-width:70px;text-align:right}
.tab-pr td.v button.vz{color:var(--muted);font-weight:600}
.mudou{display:block;font-size:12px;color:var(--muted)}
/* resumo */
.abas{display:flex;gap:8px;margin:12px}
.abas button{flex:1;border-radius:14px;padding:12px;font-family:var(--fc);font-weight:800;font-size:22px;background:#fff;border:2px solid var(--line)}
.abas button.on{background:var(--g);color:#fff;border-color:var(--g)}
.per{display:flex;align-items:center;justify-content:space-between;margin:0 12px}
.per button{background:#fff;border-radius:12px;width:54px;height:48px;font-size:26px;font-weight:800;border:2px solid var(--line)}
.per button:disabled{opacity:.3}
.per b{font-size:18px;text-align:center}
.grande-num{text-align:center;margin:12px}
.grande-num span{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:14px}
.grande-num b{display:block;font-family:var(--fc);font-size:56px;line-height:1}
.forma{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:18px;font-weight:700}
.forma i{width:14px;height:14px;border-radius:4px;flex:none}
.forma span{flex:1}
.forma .bb{flex:1.4;height:12px;background:#eef2e8;border-radius:6px;overflow:hidden}
.forma .bb u{display:block;height:100%}
.duas-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px}
.duas-col .num{margin:0}
.duas-col .num b{font-size:30px}
.lan{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2e8;width:100%;text-align:left;font-size:16px}
.lan .h{color:var(--muted);font-weight:700;width:46px;flex:none}
.lan .d{flex:1;min-width:0}
.lan .d small{display:block;color:var(--muted)}
.lan .v{font-weight:800;text-align:right}
.chip{display:inline-block;border-radius:8px;color:#fff;font-size:12px;font-weight:800;padding:1px 6px;margin-left:3px}
.dias{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:6px}
.dias div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:13px;font-weight:700;color:var(--muted)}
.dias u{display:block;width:100%;background:#cfdcc0;border-radius:6px 6px 0 0;min-height:3px}
.dias div.mel u{background:var(--lima)}
.dias div.mel{color:var(--g)}
.dias b{font-size:15px;color:var(--g)}
.fechar{display:block;width:calc(100% - 24px);margin:12px;background:var(--g);color:#fff;border-radius:16px;padding:16px;font-family:var(--fc);font-size:24px;font-weight:800}
.fechado{text-align:center;color:var(--pago);font-weight:800;margin:10px}
/* overlays */
.modal{position:fixed;inset:0;background:rgba(20,30,15,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .cx{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:sobe .18s}
.modal h3{font-family:var(--fc);font-size:26px;margin:0 0 6px}
.modal p{margin:0 0 12px;font-size:17px}
.botoes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.botoes button{border-radius:14px;padding:15px;font-weight:800;font-size:18px;background:#eef3e6}
.botoes .pri{background:var(--g);color:#fff}
.botoes .lim{background:var(--lima);color:var(--g)}
.botoes .per{background:#fff;color:var(--red);border:2px solid #f0c9c9}
.ok{position:fixed;inset:0;z-index:60;background:var(--pago);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.ok .ck{width:130px;height:130px;border-radius:50%;background:#fff;color:var(--pago);display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:800;line-height:1}
.ok b{font-family:var(--fc);font-size:44px}
.ok span{font-size:20px;font-weight:700}
.ok .acoes{display:flex;flex-direction:column;gap:10px;margin-top:20px;width:100%;max-width:340px}
.ok .acoes button{background:rgba(255,255,255,.2);color:#fff;border:2px solid #fff;border-radius:14px;padding:14px;font-weight:800;font-size:18px}
.ok .acoes .fecha{background:#fff;color:var(--pago)}
.qrbox{text-align:center}
.qrbox canvas{width:min(78vw,320px);height:auto;image-rendering:pixelated;border:10px solid #fff;margin:6px auto;display:block}
.qrbox b{font-family:var(--fc);font-size:42px;display:block}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--g);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:80;max-width:90vw;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.pergunta-foto{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-bottom:10px;background:#e6ecde}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eef2e8;font-weight:700}
.sw input{width:24px;height:24px}
.pequeno{font-size:14px;color:var(--muted)}
.esconde{display:none !important}
.bloqueio{min-height:100vh;display:flex;flex-direction:column}
.bloqueio .top{position:static}
.bloqueio .corpo{padding:20px 16px;max-width:560px;margin:0 auto;width:100%}
.bloqueio h1{font-family:var(--fc);font-size:32px;margin:6px 0 8px}
.bloqueio .id{font-family:var(--fc);font-size:34px;font-weight:800;letter-spacing:1px;background:#fff;border-radius:14px;padding:12px;text-align:center;margin:10px 0;border:2px dashed var(--line);user-select:all}
.av-acesso{margin:12px 12px 0;border-radius:14px;padding:12px 14px;font-weight:700}
.av-acesso.amarelo{background:#fff4e0;color:#7a4300}
.av-acesso.vermelho{background:#fde8e8;color:#8e1b1b}
.trava{margin:24px 12px;background:#fff;border-radius:18px;padding:24px 16px;text-align:center}
.trava b{display:block;font-family:var(--fc);font-size:26px;margin:6px 0}
.conta-l{margin:0 12px 10px;background:var(--card);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;width:calc(100% - 24px);text-align:left;border:2px solid transparent}
.conta-l .d{flex:1;min-width:0}
.conta-l .d b{display:block;font-size:19px}
.conta-l .d small{color:var(--muted);font-size:15px}
.conta-l .v{font-family:var(--fc);font-weight:800;font-size:24px;white-space:nowrap}
.conta-l.cobrar{border-color:#1565C0;background:#eef4fc}
.conta-l .tag{display:block;color:#1565C0;font-weight:800;font-size:14px}
.pg-conta{background:#1565C0;width:100%;margin-bottom:10px;font-size:24px}
.na-conta-link{width:100%;margin-top:4px;color:#1565C0;font-weight:800;text-decoration:underline;padding:8px}
.mov{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef2e8;font-size:17px;gap:8px}
.mov b{white-space:nowrap}
.mov.pag b{color:var(--pago)}
.b-cobrar{background:var(--wa);color:#fff}
.b-recebi{background:var(--lima);color:var(--g)}
</style>
</head>
<body>
<div id="app"></div>
<input id="cam" type="file" accept="image/*" capture="environment" class="esconde">
<input id="arqBackup" type="file" accept="application/json,.json" class="esconde">

const dt = s => { const [a,m,d] = s.split('-').map(Number); return new Date(a,m-1,d,12); };
const addDias = (s,n) => { const d = dt(s); d.setDate(d.getDate()+n); return ymd(d); };

const fmt0 = v => 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const so_dig = s => String(s||'').replace(/\D/g,'');
function lerValor(s){
  if (s==null) return null;
  s = String(s).trim().replace(/[R$\s]/g,'');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');   // 1.200 = mil e duzentos
  const v = Number(s);
  return isFinite(v) && v >= 0 ? r2(v) : null;
}
function hora(ts){ const d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function haQuanto(ts){
  const m = Math.floor((Date.now()-ts)/60000);
  if (m < 1) return 'agora';
  if (m < 60) return 'há '+m+' min';
  const h = Math.floor(m/60);
  if (h < 24) return 'há '+h+'h'+(m%60? pad(m%60):'');
  const d = Math.floor(h/24); return 'há '+d+(d>1?' dias':' dia');
}

const servPorId = id => D.servicos.find(s => s.id === id);
const itemPorId = id => D.itens.find(i => i.id === id);
function precoServ(sid, tam){
  const s = servPorId(sid); if (!s) return null;
  if (s.fixo != null) return s.fixo;
  if (!s.p) return null;
  return tam && s.p[tam] != null ? s.p[tam] : null;
}
function tamDoCliente(a){
  const c = acharCliente(a.tel, a.nome);
  if (c && c.tam && ((a.moto && c.tam[0]==='M') || (!a.moto && c.tam[0]!=='M'))) return c.tam;
  return null;
}
function tamMaisComum(moto){
  const cont = {};
  D.lanc.forEach(l => { if (l.tam && ((l.tam[0]==='M') === !!moto)) cont[l.tam] = (cont[l.tam]||0)+1; });
  let best = moto ? 'MM' : 'P', n = 0;
  for (const k in cont) if (cont[k] > n) { n = cont[k]; best = k; }
  return best;
}
function tamUsado(a){ return a.tam || tamDoCliente(a) || tamMaisComum(a.moto); }
function linhasServ(a){
  const tam = tamUsado(a);
  return (a.servs||[]).map(s => ({...s, preco: s.manual != null ? s.manual : (s.id==='outro' ? null : precoServ(s.id, tam))}));
}
function totalNormal(a){
  let t = 0, falta = false;
  linhasServ(a).forEach(s => { if (s.preco==null) falta = true; else t += s.preco; });
  (a.itens||[]).forEach(i => t += i.preco * i.qtd);
  return {t:r2(t), falta};
}
function resumoServ(a){
  const n = (a.servs||[]).map(s => s.nome).join(' + ');
  const q = (a.itens||[]).reduce((x,i)=>x+i.qtd,0);

}

function acharCliente(tel, nome){

  if (t.length >= 8) { const c = D.clientes.find(c => so_dig(c.tel).slice(-8) === t); if (c) return c; }
  if (nome) { const n = nome.trim().toLowerCase(); return D.clientes.find(c => (c.nome||'').trim().toLowerCase() === n) || null; }
  return null;
}
function guardarCliente(a){

  if (a.tel) c.tel = a.tel;
  if (a.nome) c.nome = a.nome;
  if (a.tam) c.tam = a.tam;

}
function linkWa(tel){

  if (n.startsWith('55') && n.length >= 12) return 'https://wa.me/'+n;

// ---------- Pix (BR Code) ----------
function semAcento(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim(); }
function campo(id, v){ return id + pad(v.length) + v; }
function crc16(s){
  let c = 0xFFFF;
  for (let i=0;i<s.length;i++){ c ^= s.charCodeAt(i) << 8; for (let j=0;j<8;j++) c = (c & 0x8000) ? ((c<<1) ^ 0x1021) & 0xFFFF : (c<<1) & 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4,'0');
}
function chavePix(){
  const k = String(D.cfg.pixChave||'').trim();
  if (/^[\d.\-\/ ]+$/.test(k) && so_dig(k).length === 14) return so_dig(k);   // CNPJ
  if (/^[\d.\-\/ ]+$/.test(k) && so_dig(k).length === 11 && !/^\(?\d{2}\)?\s?9/.test(k)) return so_dig(k); // CPF
  return k;
}
function payloadPix(valor){
  const nome = (semAcento(D.cfg.pixNome) || 'POPO').slice(0,25);
  const cid = (semAcento(D.cfg.pixCidade) || 'BRASIL').slice(0,15);
  let p = campo('00','01') + campo('26', campo('00','br.gov.bcb.pix') + campo('01', chavePix()))
        + campo('52','0000') + campo('53','986');
  if (valor > 0) p += campo('54', valor.toFixed(2));
  p += campo('58','BR') + campo('59', nome) + campo('60', cid) + campo('62', campo('05','***')) + '6304';
  return p + crc16(p);
}
function desenharQR(canvas, texto){
  const q = new QRLib.QRCode(-1, QRLib.L.M); q.addData(texto); q.make();
  const n = q.getModuleCount(), m = 4, esc_ = 8, tam = (n + m*2) * esc_;
  canvas.width = tam; canvas.height = tam;
  const g = canvas.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,tam,tam); g.fillStyle = '#000';
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) g.fillRect((c+m)*esc_, (r+m)*esc_, esc_, esc_);
}

// ---------- foto ----------
function reduzirFoto(arquivo){
  return new Promise((ok) => {
    const url = URL.createObjectURL(arquivo), img = new Image();
    img.onload = () => {
      const max = 720, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ok(null); };
    img.src = url;
  });
}

// ---------- INÍCIO ----------
function cicloAluguel(dia){
  const d = dt(dia), dv = D.cfg.aluguelDia || 10;
  let venc = new Date(d.getFullYear(), d.getMonth(), dv, 12);
  if (d.getDate() > dv) venc = new Date(d.getFullYear(), d.getMonth()+1, dv, 12);
  const ini = new Date(venc); ini.setMonth(ini.getMonth()-1); ini.setDate(ini.getDate()+1);
  return {ini: ymd(ini), fim: ymd(venc)};
}
function entrouEntre(a, b){ return r2(D.lanc.filter(l => l.data >= a && l.data <= b).reduce((x,l)=>x+l.valor,0)); }
function avisoCopia(){
  if (!D.lanc.length) return '';
  const primeiro = D.lanc.reduce((m,l) => l.data < m ? l.data : m, D.lanc[0].data);
  const base = D.cfg.ultBackup || primeiro;
  const dias = Math.round((dt(hoje()) - dt(base)) / 86400000);
  if (dias < 30) return '';
  return '<div class="bloco aviso" style="margin:12px;display:flex;align-items:center;gap:10px"><span style="flex:1">'+(D.cfg.ultBackup?'Faz '+dias+' dias da última cópia de segurança.':'Ainda não foi feita nenhuma cópia de segurança.')+'</span><button class="bq" style="background:var(--g);color:#fff" onclick="A.backup()">Salvar agora</button></div>';
}
function telaInicio(){
  const dia = U.dia;

  const carros = D.abertos.filter(a => a.tipo === 'carro' && a.data === dia && a.status !== 'pago').length + D.lanc.filter(l => l.tipo === 'carro' && (l.chegada || l.data) === dia).length;
  const entrou = r2(lh.reduce((x,l)=>x+l.valor,0));
  const ciclo = cicloAluguel(hoje()), alu = D.cfg.aluguel || 0, ja = entrouEntre(ciclo.ini, ciclo.fim);
  const pct = alu ? Math.min(100, Math.round(ja/alu*100)) : 0;

      '<div class="barra"><i style="width:'+pct+'%"></i></div><div class="pequeno" style="margin-top:6px">Entrou desde '+ddmm(ciclo.ini)+': <b>'+fmt(ja)+'</b>'+(ja<alu?' · faltam '+fmt(alu-ja):'')+'</div></div>';

  h += '<div class="grandes"><button class="btn-grande b-chegou" onclick="A.chegouCarro()">'+IC.cam+'CHEGOU CARRO</button>'+
       '<button class="btn-grande b-venda" onclick="A.novaVenda()">'+IC.copo+'VENDA</button></div>';

  h += '<h2 class="sec">Em aberto <small>'+(ab.length? ab.length+(ab.length>1?' na lista':' na lista'):'')+'</small></h2>';

function cartao(a){
  const tot = totalNormal(a);
  const cls = a.status === 'pago' ? 'pago' : a.status === 'areceber' ? 'areceber' : '';
  let faixa = '';
  if (a.status === 'pago') faixa = '<div class="faixa">PAGO · '+esc(FORMAS[a.pagoForma]?FORMAS[a.pagoForma].n:'')+' · '+fmt(a.pagoValor)+'</div>';
  if (a.status === 'areceber') faixa = '<div class="faixa">A RECEBER · desde '+ddmm(a.data)+'</div>';
  const foto = a.foto ? '<div class="foto" style="background-image:url('+a.foto+')"></div>' : '<div class="foto">'+(a.tipo==='conta'?IC.copo:IC.carro)+'</div>';

function renderFolha(){

}

    h += '<div class="it '+(q?'on':'')+'" data-item="'+it.id+'">'+(q?'<span class="qt">'+q+'</span>':'')+(IC[it.ic]||IC.copo)+'<span class="nm">'+esc(it.nome)+'</span><span class="pr" data-preco="'+it.id+'">'+fmt0(pr)+'</span></div>';
  });
  h += '<div class="it" data-item="__outro">'+IC.mais+'<span class="nm">Outro</span><span class="pr">valor</span></div>';
  (f.outros||[]).forEach((o,i) => h += '<div class="it on" data-outro="'+i+'"><span class="qt">'+o.qtd+'</span>'+IC.copo+'<span class="nm">'+esc(o.nome)+'</span><span class="pr">'+fmt0(o.preco)+'</span></div>');
  h += '</div><p class="dica">'+(alvo?'':'Conte o que foi consumido: ')+'toque soma 1 · segure o dedo para tirar 1 · toque no preço para trocar</p></div>';

  h += '<div class="bloco"><div class="total"><span>'+(alvo?'Somar à conta':'Total')+'</span><b>'+fmt(tot)+'</b></div></div>';
  if (alvo) h += '<button class="pronto" '+(tot?'':'disabled')+' onclick="A.confirmarItens()">ADICIONAR</button>';
  else h += '<button class="pronto" '+(tot?'':'disabled')+' onclick="A.pagarAgora()">RECEBER</button>';
  return h;
}
function totalCarrinho(f){
  let t = 0;
  for (const id in f.carrinho) { const it = itemPorId(id), c = f.carrinho[id]; if (it) t += (c.preco!=null?c.preco:it.venda) * c.qtd; }
  (f.outros||[]).forEach(o => t += o.preco*o.qtd);
  return r2(t);
}
function linhasCarrinho(f){
  const out = [];
  for (const id in f.carrinho) { const it = itemPorId(id), c = f.carrinho[id]; if (it && c.qtd) out.push({id, nome:it.nome, preco:c.preco!=null?c.preco:it.venda, custo:it.custo, qtd:c.qtd}); }
  (f.outros||[]).forEach(o => out.push({id:'outro', nome:o.nome, preco:o.preco, custo:null, qtd:o.qtd}));
  return out;
}
function somarItens(a, linhas){
  a.itens = a.itens || [];
  linhas.forEach(l => {
    const ex = a.itens.find(i => i.id === l.id && i.preco === l.preco && i.nome === l.nome);
    if (ex) ex.qtd += l.qtd; else a.itens.push({...l});
  });
}

// ---------- RESUMO ----------
function inicioSemana(dia){ const d = dt(dia); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); }
function calcular(a, b){
  const L = D.lanc.filter(l => l.data >= a && l.data <= b);
  const r = {total:0, formas:{pix:0,din:0,deb:0,cre:0}, carros:0, bebidas:0, lav:0, beb:0, contas:0, nContas:0, recContas:0, tam:{}, serv:{}, item:{}, L};
  L.forEach(l => {
    r.total += l.valor;
    if (l.conta) { r.contas += l.conta.valor; r.nContas++; }
    if (l.tipo === 'conta') r.recContas += l.valor;
    l.pag.forEach(p => r.formas[p.forma] += p.valor);
    if (l.tipo === 'carro') { r.carros++; if (l.tam) r.tam[l.tam] = (r.tam[l.tam]||0)+1; }
    let vs = 0, vi = 0;
    (l.servs||[]).forEach(s => { vs += s.preco||0; r.serv[s.nome] = (r.serv[s.nome]||0)+1; });
    (l.itens||[]).forEach(i => { vi += i.preco*i.qtd; r.bebidas += i.qtd; r.item[i.nome] = (r.item[i.nome]||0)+i.qtd; });
    const n = vs+vi, k = n ? l.valor/n : 0;
    if (l.tipo === 'conta') r.lav += l.valor;
    else if (n) { r.lav += vs*k; r.beb += vi*k; } else r.lav += l.valor;
  });
  ['total','lav','beb','contas','recContas'].forEach(k => r[k] = r2(r[k])); for (const k in r.formas) r.formas[k] = r2(r.formas[k]);
  return r;
}
function blocoFormas(r){
  const max = Math.max(1, ...Object.values(r.formas));
  return '<div class="bloco">'+Object.keys(FORMAS).map(k => '<div class="forma"><i style="background:'+FORMAS[k].c+'"></i><span>'+FORMAS[k].n+'</span><div class="bb"><u style="width:'+Math.round(r.formas[k]/max*100)+'%;background:'+FORMAS[k].c+'"></u></div><b style="min-width:110px;text-align:right">'+fmt(r.formas[k])+'</b></div>').join('')+'</div>';
}
function linhaContas(r){
  if (!r.contas && !r.recContas) return '';
  return '<div class="bloco" style="border:2px solid #cfe0f5">'+(r.contas?'<div class="linha"><span>Lançado em contas<br><span class="pequeno">'+r.nContas+' lançamento'+(r.nContas>1?'s':'')+' · ainda não entrou</span></span><b style="color:#1565C0">'+fmt(r.contas)+'</b></div>':'')+
    (r.recContas?'<div class="linha"><span>Contas recebidas<br><span class="pequeno">já está no total acima</span></span><b>'+fmt(r.recContas)+'</b></div>':'')+'</div>';
}
// quanto está para receber agora (contas de clientes + carros A RECEBER)
function blocoAReceber(){
  const linhas = [];
  D.contas.forEach(c => { const v = saldoConta(c); if (v > 0) linhas.push([c.nome, v, 'conta']); });
  D.abertos.filter(a => a.status === 'areceber').forEach(a => { const t = totalNormal(a); if (t.t > 0) linhas.push([(a.nome||'Carro sem nome')+' · desde '+ddmm(a.data), t.t, 'carro']); });
  if (!linhas.length) return '';
  const tot = r2(linhas.reduce((x,l)=>x+l[1],0));
  return '<div class="bloco" style="border:2px solid var(--areceber)"><h3 style="display:flex;justify-content:space-between">A receber hoje <span style="color:var(--areceber)">'+fmt(tot)+'</span></h3>'+
    linhas.map(l => '<div class="linha"><span>'+esc(l[0])+'<br><span class="pequeno">'+(l[2]==='conta'?'cliente de conta':'levou e não pagou')+'</span></span><b>'+fmt(l[1])+'</b></div>').join('')+
    '<p class="pequeno" style="margin:6px 0 0">Ainda não entrou. Entra no total do dia em que for pago.</p></div>';
}
function maisFreq(o){ let k=null,n=0; for (const x in o) if (o[x]>n){n=o[x];k=x;} return k ? k+' ('+n+')' : '—'; }
function telaResumo(){
  if (estadoAcesso().nivel === 'parcial') return '<div class="wrap">' + telaTravada() + '</div>';
  let h = '<div class="wrap"><div class="abas"><button class="'+(U.resumo==='dia'?'on':'')+'" onclick="A.aba(\'dia\')">Dia</button><button class="'+(U.resumo==='semana'?'on':'')+'" onclick="A.aba(\'semana\')">Semana</button></div>';
  if (U.resumo === 'dia') {
    const d = U.resDia, r = calcular(d, d), dd = dt(d);
    h += '<div class="per"><button onclick="A.resDia(-1)">‹</button><b>'+(d===hoje()?'Hoje, ':DIAS_SEM[dd.getDay()]+', ')+dd.getDate()+' '+MESES[dd.getMonth()]+'</b><button '+(d>=hoje()?'disabled':'')+' onclick="A.resDia(1)">›</button></div>';
    h += '<div class="grande-num"><span>Entrou no dia</span><b>'+fmt(r.total)+'</b></div>';
    h += blocoFormas(r) + linhaContas(r) + (d === hoje() ? blocoAReceber() : '');
    h += '<div class="duas-col"><div class="num"><span>Carros recebidos</span><b>'+r.carros+'</b></div><div class="num"><span>Bebidas/itens</span><b>'+r.bebidas+'</b></div></div>';
    h += '<div class="bloco"><h3>Dinheiro recebido: '+fmt(r.formas.din)+'</h3><span class="pequeno">É o que deve ter entrado na gaveta hoje.</span></div>';
    h += '<h2 class="sec">Lançamentos <small>toque para corrigir</small></h2><div class="bloco" style="margin-top:0">';
    if (!r.L.length) h += '<div class="pequeno">Nada lançado neste dia.</div>';
    r.L.slice().sort((a,b)=>b.ts-a.ts).forEach(l => {
      h += '<button class="lan" onclick="A.editarLanc(\''+l.id+'\')"><span class="h">'+hora(l.ts)+'</span><span class="d">'+esc(l.cliente || (l.tipo==='carro'?'Carro':'Venda'))+'<small>'+esc([(l.servs||[]).map(s=>s.nome).join(' + '), (l.itens||[]).map(i=>i.qtd+'× '+i.nome).join(', ')].filter(Boolean).join(' · '))+'</small></span>'+
        '<span class="v">'+(l.conta?fmt(l.conta.valor):fmt(l.valor))+'<br>'+(l.conta?'<span class="chip" style="background:#1565C0">Na conta</span>':'')+l.pag.map(p=>'<span class="chip" style="background:'+FORMAS[p.forma].c+'">'+FORMAS[p.forma].n+'</span>').join('')+'</span></button>';
    });
    h += '</div>';
    if (D.dias[d] && D.dias[d].fechado) h += '<div class="fechado">✓ Dia fechado às '+hora(D.dias[d].fechado)+'</div>';
    h += '<button class="fechar" onclick="A.fecharDia()">'+(D.dias[d]&&D.dias[d].fechado?'Fechar dia de novo':'FECHAR DIA')+'</button>';
  } else {
    const ini = U.resSem || inicioSemana(hoje()), fim = addDias(ini, 6), r = calcular(ini, fim);
    h += '<div class="per"><button onclick="A.resSem(-1)">‹</button><b>'+ddmm(ini)+' a '+ddmm(fim)+(ini===inicioSemana(hoje())?'<br><span class="pequeno">esta semana</span>':'')+'</b><button '+(ini>=inicioSemana(hoje())?'disabled':'')+' onclick="A.resSem(1)">›</button></div>';
    h += '<div class="grande-num"><span>Entrou na semana</span><b>'+fmt(r.total)+'</b></div>';
    const ant = calcular(addDias(ini,-7), addDias(ini,-1));
    if (ant.L.length) { const dif = r2(r.total-ant.total); h += '<p style="text-align:center;margin:-6px 0 8px;font-weight:700;color:'+(dif>=0?'var(--pago)':'var(--red)')+'">'+(dif>=0?'▲ ':'▼ ')+fmt(Math.abs(dif))+' em relação à semana anterior</p>'; }
    h += blocoFormas(r) + linhaContas(r) + (ini === inicioSemana(hoje()) ? blocoAReceber() : '');
    h += '<div class="duas-col"><div class="num"><span>Lavagens</span><b>'+fmt(r.lav)+'</b></div><div class="num"><span>Bebidas/itens</span><b>'+fmt(r.beb)+'</b></div></div>';
    const porDia = [...Array(7)].map((_,i) => { const d = addDias(ini,i); return {d, n:D.lanc.filter(l => l.data===d && l.tipo==='carro').length}; });
    const mx = Math.max(...porDia.map(x=>x.n));
    h += '<div class="bloco"><h3>Carros por dia · total '+r.carros+'</h3><div class="dias">'+porDia.map(x => '<div class="'+(mx&&x.n===mx?'mel':'')+'"><b>'+x.n+'</b><u style="height:'+(mx?Math.round(x.n/mx*100):0)+'%"></u>'+DIAS_SEM[dt(x.d).getDay()]+'</div>').join('')+'</div>'+
      (mx?'<p class="pequeno" style="margin:8px 0 0">Melhor dia: <b>'+porDia.filter(x=>x.n===mx).map(x=>DIAS_SEM[dt(x.d).getDay()]).join(', ')+'</b></p>':'')+'</div>';
    h += '<div class="bloco"><h3>Carros por tamanho</h3>'+(Object.keys(r.tam).length? Object.keys(TAM_NOME).filter(k=>r.tam[k]).map(k => '<div class="linha"><span>'+TAM_NOME[k]+'</span><b>'+r.tam[k]+'</b></div>').join('') : '<span class="pequeno">Sem tamanho marcado ainda.</span>')+'</div>';
    h += '<div class="bloco"><div class="linha"><span>Serviço que mais saiu</span><b>'+esc(maisFreq(r.serv))+'</b></div><div class="linha"><span>Item que mais vendeu</span><b>'+esc(maisFreq(r.item))+'</b></div><div class="linha"><span>Bebidas/itens vendidos</span><b>'+r.bebidas+'</b></div></div>';
  }
  return h + '</div>';
}

const A = {
  ir(t){ U.tela = t; if (t==='resumo') { U.resDia = U.dia; } window.scrollTo(0,0); render(); },
  trocarDia(){
    modal('<h3>Lançar em outro dia</h3><p>Para lançar algo que ficou esquecido.</p><div class="campo"><input id="dIn" type="date" max="'+hoje()+'" value="'+U.dia+'"></div>'+
      '<div class="botoes"><button class="pri" onclick="A.okDia()">Usar este dia</button><button onclick="fecharModal();A.voltarHoje()">Hoje</button></div>');
  },
  okDia(){ const v = $('#dIn').value; fecharModal(); if (v && v <= hoje()) { U.dia = v; render(); } },
  voltarHoje(){ U.dia = hoje(); render(); },

  // --- carro chega ---
  // o carro é salvo ANTES de a câmera abrir: se o celular fechar o app durante a foto, o carro não se perde
  chegouCarro(){
    const ts = U.dia === hoje() ? Date.now() : dt(U.dia).getTime();
    const a = {id:uid(), tipo:'carro', criado:ts, data:U.dia, foto:null, aguardaFoto:true, tel:'', nome:'', tam:null, moto:false, servs:[], itens:[], lembrete:'', status:'aberto'};
    D.abertos.push(a); salvar(); vibra(40);
    A.abrirCamera(a.id);
  },
  abrirCamera(aid){ U.fotoAlvo = aid; const c = $('#cam'); c.value = ''; c.click(); },
  async fotoEscolhida(arq){
    if (!arq) return;
    const foto = await reduzirFoto(arq);
    let a = U.fotoAlvo ? D.abertos.find(x => x.id === U.fotoAlvo) : null;
    U.fotoAlvo = null;
    if (!a) { A.criarCarro(foto, false); return; }
    a.foto = foto; delete a.aguardaFoto; salvar();
    const f = U.folhas[U.folhas.length-1];
    if (f && f.t === 'novo' && f.id === a.id) renderFolha(); else abrirFolha({t:'novo', id:a.id});
  },
  // tocou em CHEGOU CARRO e desistiu da câmera: o cartão vazio sai
  fotoCancelada(){
    const a = U.fotoAlvo ? D.abertos.find(x => x.id === U.fotoAlvo) : null;
    U.fotoAlvo = null;
    if (a && a.aguardaFoto && !a.foto && !a.servs.length && !a.nome && !a.tel) { D.abertos = D.abertos.filter(x => x.id !== a.id); salvar(); render(); }
  },
  criarCarro(foto, semFoto){
    const ts = U.dia === hoje() ? Date.now() : dt(U.dia).getTime();
    const a = {id:uid(), tipo:'carro', criado:ts, data:U.dia, foto, tel:'', nome:'', tam:null, moto:false, servs:[], itens:[], lembrete:'', status:'aberto'};
    D.abertos.push(a); salvar(); vibra(40);
    abrirFolha({t:'novo', id:a.id, semFoto});
  },
  semFoto(){ A.criarCarro(null, true); },
  marcarServ(aid, sid){
    const a = D.abertos.find(x => x.id === aid), s = servPorId(sid); if (!a || !s) return;
    const i = a.servs.findIndex(x => x.id === sid);
    if (i >= 0) a.servs.splice(i,1);
    else {
      if (s.grupo) a.servs = a.servs.filter(x => { const o = servPorId(x.id); return !(o && o.grupo === s.grupo); });
      a.servs.push({id:sid, nome:s.nome});
    }
    salvar(); renderFolha();
  },
  outroServ(aid){
    pedirTexto('Outro serviço', 'Nome do serviço (pode deixar em branco). O valor é pedido na hora de receber.', '', nome => {
      const a = D.abertos.find(x => x.id === aid); if (!a) return;
      a.servs.push({id:'outro', nome: nome || 'Outro serviço', manual:null}); salvar(); renderFolha();
    });
  },
  tirarOutro(aid, k){ const a = D.abertos.find(x => x.id === aid); let n=-1; a.servs = a.servs.filter(s => !(s.id==='outro' && ++n===k)); salvar(); renderFolha(); },
  digitouTel(aid, v){ const a = D.abertos.find(x => x.id === aid); if (!a) return; a.tel = v.trim(); salvar(); A.sugerir(a, 'tel'); },
  digitouNome(aid, v){ const a = D.abertos.find(x => x.id === aid); if (!a) return; a.nome = v.trim(); salvar(); A.sugerir(a, 'nome'); },
  sugerir(a, por){
    const el = $('#sugCli'); if (!el) return;
    let lista = [];
    if (por === 'tel') { const t = so_dig(a.tel); if (t.length >= 3) lista = D.clientes.filter(c => so_dig(c.tel).includes(t)); }
    else { const n = (a.nome||'').toLowerCase(); if (n.length >= 2) lista = D.clientes.filter(c => (c.nome||'').toLowerCase().includes(n)); }
    lista = lista.sort((x,y)=>(y.ult||0)-(x.ult||0)).slice(0,4);
    el.innerHTML = lista.map((c,i) => '<button onclick="A.usarCliente(\''+a.id+'\','+D.clientes.indexOf(c)+')">'+esc(c.nome||'')+' '+esc(c.tel||'')+'</button>').join('');
  },
  usarCliente(aid, ci){
    const a = D.abertos.find(x => x.id === aid), c = D.clientes[ci]; if (!a || !c) return;
    a.tel = c.tel || a.tel; a.nome = c.nome || a.nome; salvar(); renderFolha();
  },
  async contatos(aid){
    try {
      const r = await navigator.contacts.select(['name','tel'], {multiple:false});
      if (!r || !r.length) return;
      const a = D.abertos.find(x => x.id === aid); if (!a) return;
      a.nome = (r[0].name && r[0].name[0]) || a.nome; a.tel = (r[0].tel && r[0].tel[0]) || a.tel;
      salvar(); renderFolha();
    } catch(e) { toast('Não deu para abrir os contatos'); }
  },
  maisDet(){ const f = U.folhas[U.folhas.length-1]; f.mais = !f.mais; renderFolha(); },
  tam(aid, t){
    const a = D.abertos.find(x => x.id === aid); if (!a) return;
    a.tam = a.tam === t ? null : t;
    if (t[0] !== 'M' && a.moto) { a.moto = false; a.servs = a.servs.filter(s => s.id==='outro' || (servPorId(s.id)||{}).tipo !== 'moto'); }
    salvar(); renderFolha();
  },
  moto(aid){
    const a = D.abertos.find(x => x.id === aid); if (!a) return;
    a.moto = !a.moto; a.tam = null;
    a.servs = a.servs.filter(s => s.id === 'outro' || ((servPorId(s.id)||{}).tipo === 'moto') === a.moto);
    if (a.moto && !a.servs.length) a.servs.push({id:'lmo', nome:servPorId('lmo').nome});
    salvar(); renderFolha();
  },
  lembrete(aid, v){ const a = D.abertos.find(x => x.id === aid); if (a) { a.lembrete = v; salvar(); } },
  prontoNovo(){
    const f = U.folhas[U.folhas.length-1]; const a = D.abertos.find(x => x.id === f.id);
    if (a) guardarCliente(a); salvar(); voltarHojeSeOutroDia(); fecharTodas();
  },
  receberAgora(aid){ const a = D.abertos.find(x => x.id === aid); if (a) guardarCliente(a); salvar(); U.folhas = []; abrirFolha({t:'receber', id:aid}); },

  // --- receber ---
  abrir(aid){ abrirFolha({t:'receber', id:aid}); },
  tamRec(aid, t){ const a = D.abertos.find(x => x.id === aid); if (!a) return; a.tam = t; salvar(); renderFolha(); },
  tirarServ(aid, i){ const a = D.abertos.find(x => x.id === aid); a.servs.splice(i,1); salvar(); U.folhas[U.folhas.length-1].outro = null; renderFolha(); },
  tirarItem(aid, i){ const a = D.abertos.find(x => x.id === aid); const it = a.itens[i]; it.qtd--; if (it.qtd <= 0) a.itens.splice(i,1); salvar(); U.folhas[U.folhas.length-1].outro = null; renderFolha(); },
  valorServ(aid, i, v){ const a = D.abertos.find(x => x.id === aid); const val = lerValor(v); if (val==null) return; a.servs[i].manual = val; salvar(); renderFolha(); },
  addServ(aid){ abrirFolha({t:'addserv', id:aid}); },
  itensPara(aid){ abrirFolha({t:'itens', alvo:aid, carrinho:{}, outros:[]}); },
  outroValor(aid){
    const f = U.folhas[U.folhas.length-1];
    if (f.outro != null) { f.outro = null; renderFolha(); return; }
    pedirValor('Cobrar outro valor', 'Quanto você combinou com o cliente?', null, v => { f.outro = v; renderFolha(); });
  },
  duasFormas(){ const f = U.folhas[U.folhas.length-1]; f.duas = f.duas ? null : {primeira:null, v1:null}; f.mais = false; renderFolha(); },
  outrasOpcoes(){ const f = U.folhas[U.folhas.length-1]; f.mais = !f.mais; renderFolha(); },
  pagar(aid, forma){
    const f = U.folhas[U.folhas.length-1]; const a = D.abertos.find(x => x.id === aid); if (!a) return;
    const tot = totalNormal(a); if (tot.falta) return;
    const cobrar = f.outro != null ? f.outro : tot.t;
    if (f.duas) {
      if (f.duas.primeira == null) {
        const v1 = lerValor(($('#v1')||{}).value);
        if (v1 == null || v1 <= 0 || v1 >= cobrar) { toast('Digite quanto foi na 1ª forma (menos que '+fmt(cobrar)+')'); return; }
        f.duas.primeira = forma; f.duas.v1 = v1; renderFolha(); return;
      }
      if (forma === f.duas.primeira) { toast('Toque na 2ª forma (diferente da 1ª)'); return; }
      fecharPagamento(a, [{forma:f.duas.primeira, valor:f.duas.v1}, {forma, valor:r2(cobrar - f.duas.v1)}], cobrar, tot.t);
      return;
    }
    fecharPagamento(a, [{forma, valor:cobrar}], cobrar, tot.t);
  },
  mostrarQR(aid){
    const f = U.folhas[U.folhas.length-1]; const a = D.abertos.find(x => x.id === aid);
    const tot = totalNormal(a), cobrar = f.outro != null ? f.outro : tot.t;
    mostrarQR(cobrar, () => fecharPagamento(a, [{forma:'pix', valor:cobrar}], cobrar, tot.t));
  },
  entregue(aid){

// ---------- fechar pagamento ----------
function voltarHojeSeOutroDia(){
  if (U.dia !== hoje()) { const d = U.dia; U.dia = hoje(); setTimeout(() => toast('Lançado em '+ddmm(d)+'. Voltei para hoje.', 3500), 50); }
}
function fecharPagamento(a, pag, valor, normal){
  const diaLanc = U.dia;
  const ts = U.dia === hoje() ? Date.now() : dt(U.dia).getTime() + (Date.now() % 3600000);
  const tam = a.tipo === 'carro' ? tamUsado(a) : null;
  const l = {id:uid(), ts, data:U.dia, tipo:a.tipo === 'carro' ? 'carro' : 'venda', chegada:a.data, cliente:a.nome || '', tel:a.tel || '', tam,
    servs: linhasServ(a).map(s => ({id:s.id, nome:s.nome, preco:s.preco})), itens:(a.itens||[]).map(i => ({...i})),
    normal, valor:r2(valor), pag:pag.map(p => ({forma:p.forma, valor:r2(p.valor)})), desconto:r2(normal - valor)};
  D.lanc.push(l);
  if (a.tipo === 'carro') { a.tam = tam; guardarCliente(a); }

// ---------- controle de acesso (código com validade + lista de bloqueio no site) ----------
const SUPORTE = 'quem instalou o app';
const TOLERANCIA = 3;   // dias depois de vencer, antes de travar
if (!D.cfg.aparelho) { D.cfg.aparelho = ACESSO.novoId(); salvar(); }
function comSuporte(m){ m = String(m||'').trim(); return /fale com/i.test(m) ? m : (m ? m + ' ' : '') + 'Fale com ' + SUPORTE + '.'; }
function diasEntre(a, b){ return Math.round((dt(b) - dt(a)) / 86400000); }
function estadoAcesso(){
  const hj = hoje();
  if (!D.cfg.maiorData || hj > D.cfg.maiorData) { D.cfg.maiorData = hj; salvar(); }
  const ref = D.cfg.maiorData > hj ? D.cfg.maiorData : hj;          // se a data do celular voltar, vale a maior já vista
  const ate = D.cfg.codigo ? ACESSO.conferir(D.cfg.aparelho, D.cfg.codigo) : null;
  const rem = D.cfg.remoto && D.cfg.remoto.status;
  const msgRem = (D.cfg.remoto && D.cfg.remoto.msg) || '';
  if (!ate) return {nivel:'total', motivo:'ativar'};
  if (rem === 'total') return {nivel:'total', motivo:'remoto', msg:msgRem, ate};
  const resta = diasEntre(ref, ate);
  if (resta < -TOLERANCIA) return {nivel:'parcial', motivo:'vencido', ate};
  if (rem === 'parcial') return {nivel:'parcial', motivo:'remoto', msg:msgRem, ate};
  if (resta < 0) return {nivel:'ok', aviso:'tolerancia', resta: TOLERANCIA + resta + 1, ate};
  if (resta <= 7) return {nivel:'ok', aviso:'vence', resta, ate};
  return {nivel:'ok', ate};
}
const dmA = s_ => s_.slice(8,10)+'/'+s_.slice(5,7)+'/'+s_.slice(0,4);
function avisoAcesso(ac){
  if (ac.nivel === 'parcial') return '<div class="av-acesso vermelho">'+(ac.motivo==='vencido' ? 'Acesso vencido em '+dmA(ac.ate)+'.' : esc(ac.msg || 'Acesso suspenso.'))+'<br>Resumo e cobranças estão travados. Os carros continuam sendo lançados normalmente.'+(ac.motivo==='vencido' || !/fale com/i.test(ac.msg||'') ? ' Fale com '+SUPORTE+'.' : '')+'</div>';
  if (ac.aviso === 'vence') return '<div class="av-acesso amarelo">Seu acesso vence '+(ac.resta===0?'hoje':'em '+ac.resta+' dia'+(ac.resta>1?'s':''))+' ('+dmA(ac.ate)+'). Fale com '+SUPORTE+' para renovar.</div>';
  if (ac.aviso === 'tolerancia') return '<div class="av-acesso vermelho">Seu acesso venceu em '+dmA(ac.ate)+'. Em '+ac.resta+' dia'+(ac.resta>1?'s':'')+' o Resumo e as cobranças serão travados. Fale com '+SUPORTE+'.</div>';
  return '';
}

function avisoTexto(){ const ac = estadoAcesso(); return ac.motivo === 'vencido' ? 'O acesso venceu em '+dmA(ac.ate)+'. Para ver o Resumo e mandar cobranças, renove com '+SUPORTE+'.' : comSuporte(ac.msg || 'Acesso suspenso.'); }
async function checarRemoto(){
  try {
    const r = await fetch('acesso.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const j = await r.json();
    const meu = ACESSO.limpaId(D.cfg.aparelho);
    let st = null;
    for (const k in (j.bloqueados || {})) if (ACESSO.limpaId(k) === meu) st = String(j.bloqueados[k]).toLowerCase().includes('total') ? 'total' : 'parcial';
    const antes = JSON.stringify(D.cfg.remoto || {});
    D.cfg.remoto = {status:st, msg:j.mensagem || '', em:Date.now()};
    if (JSON.stringify(D.cfg.remoto) !== antes) { salvar(); render(); }
  } catch(e) { /* sem internet: vale a última situação conhecida */ }
}

// ---------- clientes de conta (fecham no sábado; o que não for pago acumula) ----------
const contaPorId = id => D.contas.find(c => c.id === id);
function contaDo(a){
  if (!D.contas.length || !a) return null;
  const t = so_dig(a.tel).slice(-8);
  if (t.length >= 8) { const c = D.contas.find(c => so_dig(c.tel).slice(-8) === t); if (c) return c; }
  const n = (a.nome||'').trim().toLowerCase();
  return n ? (D.contas.find(c => c.nome.trim().toLowerCase() === n) || null) : null;
}
function saldoConta(c, ate){
  return r2(c.movs.filter(m => !ate || m.data <= ate).reduce((x,m) => x + (m.tipo==='lav' ? m.valor : -m.valor), 0));
}
// ciclo em aberto: movimentos depois da última vez em que a conta zerou
function cicloAberto(c){
  const ms = c.movs.slice().sort((a,b)=>a.ts-b.ts);
  let run = 0, ini = 0;
  ms.forEach((m,i) => { run = r2(run + (m.tipo==='lav' ? m.valor : -m.valor)); if (run <= 0.001) ini = i+1; });
  return ms.slice(ini);
}
// semana da conta: domingo a sábado
function inicioSemConta(dia){ const d = dt(dia); d.setDate(d.getDate() - d.getDay()); return ymd(d); }
function ultimoSabado(dia){ const d = dt(dia); d.setDate(d.getDate() - ((d.getDay()+1)%7)); return ymd(d); }
// lembrete leve: só no sábado, se ainda deve e não mandou cobrança hoje
function contaPrecisaCobrar(c){

function fmtCnpj(k){ const d = so_dig(k); return d.length===14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5') : k; }

  const l = {id:uid(), ts, data:dia, tipo:a.tipo === 'carro' ? 'carro' : 'venda', chegada:a.data, cliente:c.nome, tel:c.tel, tam,

    normal, valor:0, pag:[], desconto:r2(normal - valor), conta:{id:c.id, valor:r2(valor)}};

// ---------- pergunta da manhã: carros de dias anteriores ----------
function perguntaManha(){
  const h = hoje();
  if (D.perguntaFeita === h) return;
  // carros pagos que ficaram de ontem saem sozinhos
  const antes = D.abertos.length;
  D.abertos = D.abertos.filter(a => !(a.status === 'pago' && (a.pagoEm || a.data) < h));
  if (D.abertos.length !== antes) salvar();
  const fila = D.abertos.filter(a => a.tipo === 'carro' && a.status === 'aberto' && a.data < h);
  if (!fila.length) { D.perguntaFeita = h; salvar(); return; }
  perguntarCarro(fila, 0);
}
function perguntarCarro(fila, i){
  if (i >= fila.length) { D.perguntaFeita = hoje(); salvar(); fecharModal(); render(); return; }
  const a = fila[i], tot = totalNormal(a);
  window._pc = (r) => {
    if (r === 'aqui') { /* continua aberto */ }
    else if (r === 'conta') { lancarNaConta(a, contaDo(a), tot.t, tot.t, true, a.data); }
    else if (r === 'nao') { a.status = 'areceber'; }
    else {
      const l = {id:uid(), ts:dt(a.data).getTime()+6*3600000, data:a.data, chegada:a.data, tipo:'carro', cliente:a.nome||'', tel:a.tel||'', tam:tamUsado(a),
        servs:linhasServ(a).map(s=>({id:s.id,nome:s.nome,preco:s.preco})), itens:(a.itens||[]).map(x=>({...x})), normal:tot.t, valor:tot.t, pag:[{forma:r, valor:tot.t}], desconto:0};
      if (tot.falta) { toast('Esse carro tem serviço sem valor. Abra o cartão para receber.'); }
      else { D.lanc.push(l); a.tam = l.tam; guardarCliente(a); D.abertos = D.abertos.filter(x => x.id !== a.id); }
    }
    salvar(); perguntarCarro(fila, i+1);
  };
  modal('<h3>Carro de '+ddmm(a.data)+' ('+(i+1)+' de '+fila.length+')</h3>'+(a.foto?'<img class="pergunta-foto" src="'+a.foto+'">':'')+
    '<p><b>'+esc(a.nome||'Sem nome')+'</b> · '+esc(resumoServ(a)||'sem serviço')+(tot.falta?'':' · '+fmt(tot.t))+'</p><p>Este carro já foi pago?</p>'+
    '<div class="pags">'+Object.keys(FORMAS).map(k => '<button class="pg pg-'+k+'" style="font-size:22px;min-height:60px" '+(tot.falta||!tot.t?'disabled':'')+' onclick="_pc(\''+k+'\')">'+FORMAS[k].n+'</button>').join('')+'</div>'+
    (contaDo(a)&&!tot.falta?'<button class="pg pg-conta" style="margin-top:10px;font-size:20px" onclick="_pc(\'conta\')">Na conta de '+esc(contaDo(a).nome)+'</button>':'')+
    '<div class="botoes"><button class="pri" onclick="_pc(\'aqui\')">Ainda está aqui</button><button onclick="_pc(\'nao\')" style="background:#fff1de;color:#8a4a00">Levou e ainda não pagou</button></div>');
}

// toque e segurar na grade de itens
(function(){
  let tm = null, segurou = false, alvo = null, x0 = 0, y0 = 0;
  document.addEventListener('pointerdown', e => {
    const pr = e.target.closest('[data-preco]');
    const it = e.target.closest('[data-item],[data-outro]');
    if (!it || pr) return;
    alvo = it; segurou = false; x0 = e.clientX; y0 = e.clientY;
    tm = setTimeout(() => { segurou = true; if (alvo.dataset.item && alvo.dataset.item !== '__outro') A.segurarItem(alvo.dataset.item); else if (alvo.dataset.outro) A.segurarOutro(+alvo.dataset.outro); }, 500);
  });
  document.addEventListener('pointermove', e => { if (alvo && (Math.abs(e.clientX-x0)>12 || Math.abs(e.clientY-y0)>12)) { clearTimeout(tm); alvo = null; } });
  document.addEventListener('pointerup', e => {
    clearTimeout(tm);
    const pr = e.target.closest('[data-preco]');
    if (pr && !alvo) { A.trocarPrecoItem(pr.dataset.preco); return; }
    if (alvo && !segurou) { if (alvo.dataset.item) A.toqueItem(alvo.dataset.item); else A.toqueOutro(+alvo.dataset.outro); }
    alvo = null;
  });
  document.addEventListener('pointercancel', () => { clearTimeout(tm); alvo = null; });
  document.addEventListener('contextmenu', e => { if (e.target.closest('[data-item],[data-outro]')) e.preventDefault(); });
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checarRemoto(); if (U.dia < hoje() && !U.folhas.length) U.dia = hoje(); render(); perguntaManha(); } });
window.addEventListener('popstate', () => { if ($('#modal')) { fecharModal(); history.pushState(null,''); } else if (U.folhas.length) { fecharFolha(); history.pushState(null,''); } });
history.pushState(null,'');
// atualiza "há x min" dos cartões
setInterval(() => { if (U.tela === 'inicio' && !U.folhas.length && !$('#modal') && !$('#ok')) render(); }, 60000);

try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
checarRemoto();
setInterval(checarRemoto, 30*60000);
(function(){
  if (estadoAcesso().nivel === 'total') return;
  const p = D.abertos.find(a => a.aguardaFoto && !a.foto && Date.now() - a.criado < 15*60000);
  if (p) { abrirFolha({t:'novo', id:p.id}); return; }
  perguntaManha();
})();
// atalho do ícone (segurar o ícone > Chegou carro): o navegador só abre a câmera depois de um toque
if (new URLSearchParams(location.search).get('acao') === 'carro') {
  history.replaceState(null, '', location.pathname);
  modal('<h3>Chegou carro</h3><div class="botoes"><button class="lim" style="font-size:26px;padding:26px" onclick="fecharModal();A.chegouCarro()">TIRAR FOTO</button><button onclick="fecharModal()">Voltar</button></div>');
}
</script>
</body>
</html>
